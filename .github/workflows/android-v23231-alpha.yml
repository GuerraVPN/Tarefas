name: Android 2.3.23.1 Alpha - Patch Manager

on:
  workflow_dispatch:
  push:
    branches: [alpha-2.3.23.1]
    paths:
      - 'app/mobile-patch-manager-v23231.js'
      - 'app/release-v23231.txt'
      - 'scripts/build-mobile-v23231.mjs'
      - 'scripts/verify-mobile-v23231.mjs'
      - 'scripts/release-mobile-v23231.sh'
      - '.github/workflows/android-v23231-alpha.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar, validar, assinar e publicar Alpha
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v23231.sh
          scripts/release-mobile-v23231.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.23.1-alpha-build-270
          path: |
            TAREFAS-2.3.23.1.apk
            TAREFAS-2.3.23.1.apk.sha256
            TAREFAS-2.3.23.1-alpha-build-270.zip
            TAREFAS-2.3.23.1-alpha-build-270.zip.sha256
            app/release-v23231.txt
            dist/ALPHA_2_3_23_1.json
          if-no-files-found: error
