name: CrediFlow Android v0.2 build 2

on:
  push:
    branches:
      - crediflow-v0.2-build2
    paths:
      - "crediflow-android/**"
      - ".github/workflows/crediflow-android-build.yml"
  pull_request:
    paths:
      - "crediflow-android/**"
      - ".github/workflows/crediflow-android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        run: gradle -p crediflow-android :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp crediflow-android/app/build/outputs/apk/debug/app-debug.apk CrediFlow-v0.2-build2-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrediFlow-v0.2-build2-debug
          path: CrediFlow-v0.2-build2-debug.apk
          if-no-files-found: error
