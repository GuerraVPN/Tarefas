name: Sync SHA 2.4.5.1

on:
  push:
    branches: [app/releases]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, "chore(ci): sync 2.4.5.1 sha256") }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate and sync SHA-256
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/releases/patches/TAREFAS-2.4.5.1.tpatch'
          CATALOG='app/releases/patches/catalog-v1.json'
          HASH=$(sha256sum "$FILE" | awk '{print $1}')
          echo "2.4.5.1 raw SHA-256: $HASH"
          python3 - "$CATALOG" "$HASH" <<'PY'
          import json,sys
          path,sha=sys.argv[1:]
          with open(path,'r',encoding='utf-8') as f: data=json.load(f)
          found=False
          for section in ('patches','history'):
              for item in data.get(section,[]):
                  if item.get('id')=='2.4.5.1':
                      item['sha256']=sha
                      found=True
          if not found: raise SystemExit('2.4.5.1 not found in catalog')
          with open(path,'w',encoding='utf-8',newline='\n') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CATALOG"
          git diff --cached --quiet && { echo 'Catalog already synchronized.'; exit 0; }
          git commit -m 'chore(ci): sync 2.4.5.1 sha256'
          git push
