name: CrediFlow apply loan flow patch

on:
  push:
    branches:
      - crediflow-v0.2-build2
    paths:
      - "crediflow-android/patch_v02b2_loan_flow.py"
      - ".github/workflows/crediflow-apply-loan-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: crediflow-v0.2-build2
      - name: Apply loan patch
        run: python3 crediflow-android/patch_v02b2_loan_flow.py
      - name: Commit patched source
        run: |
          git config user.name "CrediFlow CI"
          git config user.email "actions@users.noreply.github.com"
          git add crediflow-android/app/src/main/java/br/com/guerravpn/crediflow/Api.kt crediflow-android/app/src/main/java/br/com/guerravpn/crediflow/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "CrediFlow 0.2 build 2: loan request and manual Pix flow"
          git push origin HEAD:crediflow-v0.2-build2
