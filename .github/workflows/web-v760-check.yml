name: Web 7.6.0 Games Check
on:
  push:
    branches: [web/v760-prep]
    paths:
      - 'games.html'
      - 'games.css'
      - 'games.js'
      - 'v7_6_0_patch.js'
      - 'v7_5_1_version.js'
      - 'v7_5_1_about.js'
      - '.github/workflows/web-v760-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/v760-prep
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check games.js
          node --check v7_6_0_patch.js
          node --check v7_5_1_version.js
          node --check v7_5_1_about.js
      - name: Validar Web 7.6.0
        run: |
          grep -q "VERSION='7.6.0'" v7_5_1_version.js
          grep -q "v7_6_0_patch.js" v7_5_1_version.js
          grep -q "{v:'7.6.0'" v7_5_1_about.js
          grep -q "WEB 7.6.0" games.js
          grep -q "v1_9_8_start_game_run" games.js
          grep -q "v1_9_8_submit_game_score" games.js
          grep -q "v1_9_8_games_leaderboard" games.js
          grep -q "AudioDirector" games.js
          grep -q "setPointerCapture" games.js
          grep -q "user-select:none" games.css
          grep -q "touch-action:manipulation" games.css
          grep -q "v6_2_mobile.js" games.html
          grep -q "Voltar ao Quadro" games.html
          grep -q "🎮 Jogos" v7_6_0_patch.js
