name: Rerun Android 1.9.8 Release
on:
  push:
    branches: [app/android-v198-prep]
    paths: ['.github/workflows/android-v198-rerun.yml']
permissions:
  actions: write
  contents: read
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar workflow de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-v198-release.yml --repo GuerraVPN/Tarefas --ref app/android-v198-prep
