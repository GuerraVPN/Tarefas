name: Android 2.4.14-prerelease Beta — build 301

on:
  workflow_dispatch:
  push:
    branches: [app/android-v2414-beta-prep]
    paths:
      - 'app/android/TarefasBiometricPlugin.java'
      - 'app/release-v2414.txt'
      - 'patches/TAREFAS-2.4.9.11.tpatch'
      - 'patches/TAREFAS-2.4.13.2.tpatch'
      - 'scripts/build-mobile-v2486.mjs'
      - 'scripts/build-mobile-v249.mjs'
      - 'scripts/build-mobile-v2414.mjs'
      - 'scripts/verify-mobile-v2486.mjs'
      - 'scripts/verify-mobile-v249.mjs'
      - 'scripts/verify-mobile-v2414.mjs'
      - 'scripts/release-mobile-v2414.sh'
      - '.github/workflows/android-v2414-beta.yml'

concurrency:
  group: android-v2414-prerelease-beta
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: app/android-v2414-beta-prep
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar, validar, assinar e publicar 2.4.14-prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v2414.sh
          scripts/release-mobile-v2414.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.14-prerelease-beta-build-301
          path: |
            TAREFAS-2.4.14-prerelease.apk
            TAREFAS-2.4.14-prerelease.apk.sha256
            TAREFAS-2.4.14-prerelease-beta-build-301.zip
            TAREFAS-2.4.14-prerelease-beta-build-301.zip.sha256
            app/release-v2414.txt
            dist/BETA_2_4_14.json
          if-no-files-found: error
