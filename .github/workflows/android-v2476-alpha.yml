name: Android 2.4.7.6 Alpha - preservar Patch Manager e reestruturação do Dashboard

on:
  workflow_dispatch:
  push:
    branches: [app/android-v2476-alpha-prep]
  pull_request:
    branches: [main]
    paths:
      - 'app/android/TarefasLauncherIconPlugin.java'
      - 'app/mobile-launcher-icon-v241.js'
      - 'app/release-v2476.txt'
      - 'app/mobile-dashboard-v184.js'
      - 'app/mobile-dashboard-v185.js'
      - 'scripts/build-mobile-v246.mjs'
      - 'scripts/build-mobile-v2476.mjs'
      - 'scripts/verify-mobile-v2476.mjs'
      - 'scripts/release-mobile-v2476.sh'
      - 'patches/TAREFAS-2.4.6.8.tpatch'
      - '.github/workflows/android-v2476-alpha.yml'

concurrency:
  group: android-v2476-alpha
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar, validar, assinar e publicar 2.4.7.6 Alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v2476.sh
          scripts/release-mobile-v2476.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.7.6-alpha-build-288
          path: |
            TAREFAS-2.4.7.6.apk
            TAREFAS-2.4.7.6.apk.sha256
            TAREFAS-2.4.7.6-alpha-build-288.zip
            TAREFAS-2.4.7.6-alpha-build-288.zip.sha256
            app/release-v2476.txt
            dist/ALPHA_2_4_7_6.json
          if-no-files-found: error
