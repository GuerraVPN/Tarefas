name: Android 2.3.22.3 Alpha - Prep autorizado

on:
  workflow_dispatch:
  push:
    branches: [app/android-v23223-prep]
    paths:
      - '.v23223-release-trigger'
      - 'app/mobile-alpha-v23223-fix.js'
      - 'app/release-v23223.txt'
      - 'scripts/build-mobile-v23223.mjs'
      - 'scripts/verify-mobile-v23223.mjs'
      - 'scripts/release-mobile-v23223.sh'
      - '.github/workflows/android-v23223-alpha-prep.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, assinar, publicar e registrar Alpha
        run: bash scripts/release-mobile-v23223.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.22.3-alpha-build-266
          path: |
            TAREFAS-2.3.22.3.apk
            TAREFAS-2.3.22.3.apk.sha256
            TAREFAS-2.3.22.3-alpha-build-266.zip
            TAREFAS-2.3.22.3-alpha-build-266.zip.sha256
            app/release-v23223.txt
            dist/ALPHA_2_3_22_3.json
          if-no-files-found: error
