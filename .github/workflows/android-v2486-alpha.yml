name: Android 2.4.8.6 Alpha - Biometria

on:
  workflow_dispatch:
  push:
    branches: [app/android-v2486-alpha-prep]
    paths:
      - 'app/android/TarefasBiometricPlugin.java'
      - 'app/release-v2486.txt'
      - 'patches/TAREFAS-2.4.8.1.tpatch'
      - 'patches/TAREFAS-2.4.8.2.tpatch'
      - 'patches/TAREFAS-2.4.8.3.tpatch'
      - 'patches/TAREFAS-2.4.8.4.tpatch'
      - 'patches/TAREFAS-2.4.8.5.tpatch'
      - 'scripts/build-mobile-v2486.mjs'
      - 'scripts/verify-mobile-v2486.mjs'
      - 'scripts/release-mobile-v2486.sh'
      - '.github/workflows/android-v2486-alpha.yml'

concurrency:
  group: android-v2486-alpha
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: app/android-v2486-alpha-prep

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar, validar, assinar e publicar 2.4.8.6 Alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v2486.sh
          scripts/release-mobile-v2486.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.8.6-alpha-build-292
          path: |
            TAREFAS-2.4.8.6.apk
            TAREFAS-2.4.8.6.apk.sha256
            TAREFAS-2.4.8.6-alpha-build-292.zip
            TAREFAS-2.4.8.6-alpha-build-292.zip.sha256
            app/release-v2486.txt
            dist/ALPHA_2_4_8_6.json
          if-no-files-found: error
