name: Android 2.4.10 Beta — pré-release da linha 2.5

on:
  workflow_dispatch:
  push:
    branches: [app/android-v2410-beta-prep]
    paths:
      - 'scripts/build-mobile-v2410.mjs'
      - 'scripts/verify-mobile-v2410.mjs'
      - 'scripts/release-mobile-v2410.sh'
      - 'app/android/TarefasBiometricPlugin.java'
      - 'patches/TAREFAS-2.4.9.11.tpatch'
      - '.github/workflows/android-v2410-beta.yml'

concurrency:
  group: android-v2410-beta
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: app/android-v2410-beta-prep
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar, validar, assinar e publicar 2.4.10 Beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v2410.sh
          scripts/release-mobile-v2410.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.10-beta-build-295
          path: |
            TAREFAS-2.4.10.apk
            TAREFAS-2.4.10.apk.sha256
            TAREFAS-2.4.10-beta-build-295.zip
            TAREFAS-2.4.10-beta-build-295.zip.sha256
            dist/BETA_2_4_10.json
          if-no-files-found: error
