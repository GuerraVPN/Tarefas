name: temp-verify-sha-2466
on:
  push:
    branches: [app/releases]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Alpha 2.4.6.6
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const raw=fs.readFileSync('patches/TAREFAS-2.4.6.6.tpatch');
          const p=JSON.parse(raw.toString('utf8'));
          new Function(p.payload.js);
          const payloadText=JSON.stringify({js:String(p?.payload?.js||''),css:String(p?.payload?.css||'')});
          const h=x=>crypto.createHash('sha256').update(x).digest('hex');
          console.log(JSON.stringify({
            payloadSha:h(Buffer.from(payloadText,'utf8')),
            rawSha:h(raw),
            rawBytes:raw.length,
            payloadTextBytes:Buffer.byteLength(payloadText,'utf8'),
            hardcodedGoogle:p.payload.js.includes('docs.google.com'),
            api:p.payload.js.includes('/functions/v1/tarefas-escalas'),
            services:p.payload.js.includes('hotbarServices:true'),
            sameAccess:p.payload.js.includes('hotbarOpensSameScale:true'),
            singleTab:p.payload.js.includes('singleScaleTab:true'),
            readOnly:p.payload.js.includes('readOnly:true'),
            observer:p.payload.js.includes('MutationObserver')
          }));
          NODE