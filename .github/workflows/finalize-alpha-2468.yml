name: finalize-alpha-2468
on:
  push:
    branches: [app/releases]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/releases
          fetch-depth: 0
      - name: Finalize 2.4.6.8 and catalog
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const patchPath='patches/TAREFAS-2.4.6.8.tpatch';
          const catalogPath='patches/catalog-v1.json';
          const patch=JSON.parse(fs.readFileSync(patchPath,'utf8'));
          const payloadText=JSON.stringify({js:String(patch.payload?.js||''),css:String(patch.payload?.css||'')});
          patch.payloadSha256=crypto.createHash('sha256').update(payloadText,'utf8').digest('hex');
          fs.writeFileSync(patchPath,JSON.stringify(patch,null,2)+'\n');
          const fileSha=crypto.createHash('sha256').update(fs.readFileSync(patchPath)).digest('hex');
          const catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          catalog.latestPatch='2.4.6.8';
          catalog.generatedAt=new Date().toISOString();
          catalog.cacheNonce='2468-sha-r1';
          const entry={
            id:'2.4.6.8',
            name:patch.name,
            baseVersion:'2.4.6',
            minBuild:281,
            maxBuild:281,
            channel:'alpha',
            publishedAt:new Date().toISOString(),
            cumulative:true,
            replacementMode:'replace-older-same-base',
            replaces:patch.replaces,
            installable:true,
            description:patch.description,
            url:'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/patches/TAREFAS-2.4.6.8.tpatch',
            sha256:fileSha,
            changelog:patch.changelog
          };
          catalog.patches=(catalog.patches||[]).filter(x=>x.id!=='2.4.6.8');
          catalog.patches.push(entry);
          fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          console.log(JSON.stringify({payloadSha256:patch.payloadSha256,fileSha256:fileSha},null,2));
          NODE
      - name: Commit finalized patch
        run: |
          git config user.name "GuerraVPN"
          git config user.email "81371258+GuerraVPN@users.noreply.github.com"
          git add patches/TAREFAS-2.4.6.8.tpatch patches/catalog-v1.json
          git commit -m "release(patch): finalize Alpha 2.4.6.8"
          git push origin HEAD:app/releases
      - name: Remove finalizer workflow
        run: |
          git rm .github/workflows/finalize-alpha-2468.yml
          git commit -m "chore(ci): remove temporary 2.4.6.8 finalizer"
          git push origin HEAD:app/releases
