name: Patch SHA 2.4.6.2
on:
  push:
    branches: [app/releases]
    paths:
      - 'patches/TAREFAS-2.4.6.2.tpatch'
      - 'patches/catalog-v1.json'
      - '.github/workflows/patch-sha-2462.yml'
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'sync SHA bruto da 2.4.6.2')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync raw SHA
        run: |
          set -e
          SHA=$(sha256sum patches/TAREFAS-2.4.6.2.tpatch | cut -d' ' -f1)
          python3 - <<PY
          import json
          p='patches/catalog-v1.json'
          d=json.load(open(p,encoding='utf-8'))
          for x in d.get('patches',[]):
              if x.get('id')=='2.4.6.2':
                  x['sha256']='${SHA}'
          d['cacheNonce']='2462-r3'
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('RAW_SHA256=${SHA}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches/catalog-v1.json
          git commit -m "fix(patch): sincronizar SHA bruto da 2.4.6.2"
          git push
