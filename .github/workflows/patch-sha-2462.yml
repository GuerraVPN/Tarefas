name: Patch SHA 2.4.6.2
on:
  push:
    branches: [app/releases]
    paths:
      - 'patches/TAREFAS-2.4.6.2.tpatch'
      - 'patches/catalog-v1.json'
      - '.github/workflows/patch-sha-2462.yml'
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'finalizar SHA da 2.4.6.2')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix internal and raw SHA
        run: |
          set -e
          python3 - <<'PY'
          import hashlib, json
          patch_path='patches/TAREFAS-2.4.6.2.tpatch'
          catalog_path='patches/catalog-v1.json'

          with open(patch_path, encoding='utf-8') as f:
              patch=json.load(f)

          payload=patch.get('payload') or {}
          payload_text=json.dumps({
              'js': str(payload.get('js') or ''),
              'css': str(payload.get('css') or '')
          }, ensure_ascii=False, separators=(',', ':'))
          internal_sha=hashlib.sha256(payload_text.encode('utf-8')).hexdigest()
          patch['payloadSha256']=internal_sha

          with open(patch_path, 'w', encoding='utf-8') as f:
              json.dump(patch, f, ensure_ascii=False, indent=2)
              f.write('\n')

          with open(patch_path, 'rb') as f:
              raw_sha=hashlib.sha256(f.read()).hexdigest()

          with open(catalog_path, encoding='utf-8') as f:
              catalog=json.load(f)
          for x in catalog.get('patches', []):
              if x.get('id') == '2.4.6.2':
                  x['sha256']=raw_sha
          catalog['cacheNonce']='2462-r4'

          with open(catalog_path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print('INTERNAL_SHA256=' + internal_sha)
          print('RAW_SHA256=' + raw_sha)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches/TAREFAS-2.4.6.2.tpatch patches/catalog-v1.json
          git commit -m "fix(patch): finalizar SHA da 2.4.6.2"
          git push
