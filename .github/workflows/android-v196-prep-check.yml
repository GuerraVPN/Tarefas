name: Android 1.9.6 Prep Check

on:
  push:
    branches: [app/android-v196-prep]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/android-v196-prep-check.yml'
      - '*.html'
      - '*.js'
      - '*.css'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:web
      - run: npm run verify:web
      - name: Conferir recursos 1.9.6
        run: |
          grep -q '1.9.6 • WEB 7.5.7' dist/mobile-v12.js
          grep -q 'Alterar tarefa' dist/mobile-v196.js
          grep -q 'v1_9_6_message_block_status' dist/mobile-v196.js
          grep -q 'v1_9_6_set_message_block' dist/mobile-v196.js
          grep -q 'v1_9_6_send_message' dist/mobile-v196.js
          grep -q 'Este usuário bloqueou suas mensagens' dist/mobile-v196.js
          grep -q 'mobile-v196.js' dist/minhas_tarefas.html
          grep -q 'mobile-v196.js' dist/usuarios.html
