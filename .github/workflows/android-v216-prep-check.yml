name: Android 2.1.6 Prep Check

on:
  push:
    branches: [app/android-v216-prep]
    paths:
      - 'scripts/build-mobile-v216.mjs'
      - 'scripts/verify-mobile-v216.mjs'
      - '.github/workflows/android-v216-prep-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/android-v216-prep
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar correção Web 7.6.8
        run: |
          set -euo pipefail
          git fetch origin main
          for f in v4_tema.js v4_tema.css v7_6_8_theme_fix.js configuracoes.html v7_5_1_version.js v7_5_1_about.js v6_2_mobile.js; do
            git show "origin/main:$f" > "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('package.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['version']='2.1.6'
          d['description']='TAREFAS Android 2.1.6 build 216 beta com Base Web 7.6.8 e correção da troca de temas.'
          d['scripts']['build:web']='node scripts/build-mobile-v216.mjs'
          d['scripts']['verify:web']='node scripts/verify-mobile-v216.mjs dist'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('package-lock.json'); s=p.read_text(encoding='utf-8')
          s=s.replace('"version": "2.1.5"','"version": "2.1.6"',2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Instalar dependências
        run: npm ci
      - name: Gerar bundle
        run: npm run build:web
      - name: Validar bundle
        run: |
          npm run verify:web
          node --check dist/v7_6_8_theme_fix.js
          grep -q '2.1.6 • WEB 7.6.8' dist/mobile-v12.js
          grep -q 'v7_6_8_theme_fix.js?v=2.1.6' dist/configuracoes.html
          grep -q '__TAREFAS_V768_THEME_FIX__' dist/v7_6_8_theme_fix.js
      - name: Salvar fonte validada
        run: |
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add v4_tema.js v4_tema.css v7_6_8_theme_fix.js configuracoes.html v7_5_1_version.js v7_5_1_about.js v6_2_mobile.js package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): incorporar tema Web 7.6.8 na beta 2.1.6'
            git push origin HEAD:app/android-v216-prep
          fi
