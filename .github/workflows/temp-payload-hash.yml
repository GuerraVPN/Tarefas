name: temp-payload-hash
on:
  push:
    branches:
      - app/releases
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate payload SHA
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p=JSON.parse(fs.readFileSync('patches/TAREFAS-2.4.9.1.tpatch','utf8'));
          const s=JSON.stringify({js:String(p.payload?.js||''),css:String(p.payload?.css||'')});
          console.log('PAYLOAD_SHA256='+crypto.createHash('sha256').update(Buffer.from(s,'utf8')).digest('hex'));
          console.log('PAYLOAD_BYTES='+Buffer.byteLength(s,'utf8'));
          NODE
