name: Android Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - app/android-v1
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle 1.8.4 beta
        run: npm run build:web

      - name: Conferência 1 - auditoria do bundle 1.8.4
        run: npm run verify:web

      - name: Gerar ZIP 1.8.4
        run: |
          rm -f TAREFAS-1.8.4-web.zip
          cd dist
          zip -qr ../TAREFAS-1.8.4-web.zip .

      - name: Conferência 2 - validar ZIP 1.8.4
        run: |
          set -euo pipefail
          unzip -tq TAREFAS-1.8.4-web.zip
          rm -rf /tmp/tarefas-184
          mkdir -p /tmp/tarefas-184
          unzip -q TAREFAS-1.8.4-web.zip -d /tmp/tarefas-184
          node scripts/verify-mobile-build.mjs /tmp/tarefas-184
          grep -q '1.8.4 • WEB 7.5.3' /tmp/tarefas-184/mobile-v12.js
          grep -q "tarefasAppBuild = '184'" /tmp/tarefas-184/mobile-preload.js
          grep -q "VERSION='7.5.3'" /tmp/tarefas-184/v7_5_1_version.js
          grep -q 'v7_5_3_patch.js' /tmp/tarefas-184/v7_5_1_version.js
          grep -q 'v1_8_get_beta_updates' /tmp/tarefas-184/mobile-updates-v181.js
          grep -q 'Receber versões beta' /tmp/tarefas-184/mobile-updates-v181.js
          grep -q 'v1_7_registrar_push_device' /tmp/tarefas-184/native-mobile.js
          grep -q 'downloadFile' /tmp/tarefas-184/native-mobile.js
          grep -q 'about.html?update=' /tmp/tarefas-184/native-mobile.js
          grep -q 'localNotificationActionPerformed' /tmp/tarefas-184/native-mobile.js
          grep -q 'Próximo serviço' /tmp/tarefas-184/mobile-dashboard-v184.js
          grep -q 'rodizio_usuario_id' /tmp/tarefas-184/mobile-dashboard-v184.js
          grep -q 'tarefas_v743_period' /tmp/tarefas-184/mobile-dashboard-v184.js

      - name: Upload ZIP 1.8.4 conferido
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.4-beta-web-checked
          path: TAREFAS-1.8.4-web.zip
          if-no-files-found: error

      - name: Conferir Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' \
            -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json
          grep -q 'tarefas-561c8' app/google-services.json
          grep -q 'current_key' app/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Configurar acesso a arquivos Android
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions='''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n'''
          if 'android.permission.READ_EXTERNAL_STORAGE' not in s:
              s=s.replace('<application', permissions+'    <application', 1)
          if 'android:requestLegacyExternalStorage' not in s:
              s=s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'WRITE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml

      - name: Instalar Firebase no projeto Android
        run: cp app/google-services.json android/app/google-services.json

      - name: Set Android app version
        run: |
          sed -i 's/versionCode 1/versionCode 184/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.8.4"/' android/app/build.gradle

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/tarefas-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Generate Android icon assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Conferir plugin FileTransfer Android
        run: |
          grep -R -q 'capacitor-file-transfer' android/settings.gradle android/capacitor.settings.gradle 2>/dev/null || grep -R -q 'FileTransfer' android 2>/dev/null

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Conferência 3 - validar APK 1.8.4 beta
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tq "$APK"
          python - <<'PY'
          import json
          with open('android/app/build/outputs/apk/debug/output-metadata.json', encoding='utf-8') as f:
              el=json.load(f)['elements'][0]
          assert int(el['versionCode']) == 184, el
          assert str(el['versionName']) == '1.8.4', el
          print('versionCode=184 / versionName=1.8.4 BETA OK')
          PY
          unzip -p "$APK" assets/public/mobile-bootstrap.js > /tmp/184-bootstrap.js
          unzip -p "$APK" assets/public/mobile-v12.js > /tmp/184-mobile-ui.js
          unzip -p "$APK" assets/public/mobile-preload.js > /tmp/184-preload.js
          unzip -p "$APK" assets/public/mobile-updates-v181.js > /tmp/184-updates.js
          unzip -p "$APK" assets/public/mobile-dashboard-v184.js > /tmp/184-dashboard.js
          unzip -p "$APK" assets/public/native-mobile.js > /tmp/184-native.js
          unzip -p "$APK" assets/public/v7_5_3_patch.js > /tmp/184-web753.js
          grep -q "APP_VERSION = '1.8.4'" /tmp/184-bootstrap.js
          grep -q 'APP_BUILD = 184' /tmp/184-bootstrap.js
          grep -q '1.8.4 • WEB 7.5.3' /tmp/184-mobile-ui.js
          grep -q "APP_VERSION = '1.8.4'" /tmp/184-updates.js
          grep -q 'APP_BUILD = 184' /tmp/184-updates.js
          grep -q "APP_CHANNEL = 'beta'" /tmp/184-updates.js
          grep -q 'v1_8_latest_app_version' /tmp/184-updates.js
          grep -q 'Receber versões beta' /tmp/184-updates.js
          grep -q 'Próximo serviço' /tmp/184-dashboard.js
          grep -q 'PREV.' /tmp/184-dashboard.js
          grep -q 'TSV' /tmp/184-dashboard.js
          grep -q 'rodizio_usuario_id' /tmp/184-dashboard.js
          grep -q 'rodizio_pessoa_externa_id' /tmp/184-dashboard.js
          grep -q 'tarefas_v743_period' /tmp/184-dashboard.js
          grep -q 'v1_7_registrar_push_device' /tmp/184-native.js
          grep -q 'pushNotificationActionPerformed' /tmp/184-native.js
          grep -q 'localNotificationActionPerformed' /tmp/184-native.js
          grep -q 'downloadFile' /tmp/184-native.js
          grep -q 'about.html?update=' /tmp/184-native.js
          grep -q 'Salvar ou abrir atualização' /tmp/184-native.js
          grep -q 'data-v743-shift' /tmp/184-web753.js
          grep -q 'day-service-v753' /tmp/184-web753.js
          GS="$(grep -rl --include='*.xml' 'google_app_id' android/app/build/generated | head -1)"
          test -n "$GS" && test -s "$GS"
          grep -q 'gcm_defaultSenderId' "$GS"
          grep -q 'google_api_key' "$GS"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions "$APK" > /tmp/184-permissions.txt
          grep -q 'android.permission.READ_EXTERNAL_STORAGE' /tmp/184-permissions.txt
          grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' /tmp/184-permissions.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Assinar distribuição com GuerraVPN
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $OIDC" \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' \
            -o /tmp/tarefas-signing.json
          jq -r '.keystore_b64' /tmp/tarefas-signing.json | base64 -d > /tmp/GuerraVPN.keystore
          STORE_PASS="$(jq -r '.store_password' /tmp/tarefas-signing.json)"
          KEY_ALIAS="$(jq -r '.key_alias' /tmp/tarefas-signing.json)"
          KEY_PASS="$(jq -r '.key_password' /tmp/tarefas-signing.json)"
          EXPECTED_CERT="$(jq -r '.cert_sha256' /tmp/tarefas-signing.json)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign \
            --ks /tmp/GuerraVPN.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out TAREFAS-1.8.4.apk \
            android/app/build/outputs/apk/debug/app-debug.apk
          VERIFY="$($APKSIGNER verify --verbose --print-certs TAREFAS-1.8.4.apk)"
          printf '%s\n' "$VERIFY"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          rm -f /tmp/tarefas-signing.json /tmp/GuerraVPN.keystore
          sha256sum TAREFAS-1.8.4.apk

      - name: Publicar APK permanente
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          git fetch origin app/releases
          rm -rf /tmp/tarefas-releases
          git worktree add /tmp/tarefas-releases origin/app/releases
          mkdir -p /tmp/tarefas-releases/downloads
          cp TAREFAS-1.8.4.apk /tmp/tarefas-releases/downloads/TAREFAS-1.8.4.apk
          cd /tmp/tarefas-releases
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add downloads/TAREFAS-1.8.4.apk
          if git diff --cached --quiet; then
            echo 'APK 1.8.4 já publicado.'
          else
            git commit -m 'release(android): TAREFAS 1.8.4 beta build 184'
            git push origin HEAD:app/releases
          fi
          cd -
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-1.8.4.apk'
          LOCAL_SHA="$(sha256sum TAREFAS-1.8.4.apk | awk '{print $1}')"
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error -L "$URL" -o /tmp/tarefas-published.apk; then
              REMOTE_SHA="$(sha256sum /tmp/tarefas-published.apk | awk '{print $1}')"
              if [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then echo 'APK permanente conferido.'; exit 0; fi
            fi
            sleep 3
          done
          echo 'Falha ao conferir APK publicado.' >&2
          exit 1

      - name: Registrar beta no servidor e disparar push
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-1.8.4.apk | awk '{print $1}')"
          jq -n \
            --arg version '1.8.4' \
            --argjson build 184 \
            --arg channel 'beta' \
            --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-1.8.4.apk' \
            --arg sha "$SHA" \
            '{version:$version,build:$build,channel:$channel,download_url:$url,sha256:$sha}' > /tmp/release.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $OIDC" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/release.json \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish' \
            -o /tmp/release-result.json
          jq -e '.ok == true and .version == "1.8.4" and .build == 184' /tmp/release-result.json >/dev/null
          echo '1.8.4 beta registrada; push será enviado somente a quem optou por betas.'

      - name: Upload APK 1.8.4 beta assinado
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.4-beta-GuerraVPN
          path: TAREFAS-1.8.4.apk
          if-no-files-found: error

      - name: Upload APK de conferência
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.4-beta-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
