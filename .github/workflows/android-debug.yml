name: Android 2.3.0 Official Release

on:
  workflow_dispatch:
  push:
    branches: [app/android-v230-prep]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout fonte 2.3.0
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit

      - name: Validar proteção do endpoint IA
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error -o "$RUNNER_TEMP/ai-auth.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"prompt":"teste de autenticação"}' 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/tarefas-ai')"
          test "$HTTP_CODE" = '401'
          jq -e '.error == "session_required"' "$RUNNER_TEMP/ai-auth.json" >/dev/null

      - name: Gerar e validar App 2.3.0 / Web 7.8.0
        run: |
          set -euo pipefail
          npm run build:web
          npm run verify:web
          grep -q '2.3.0 • WEB 7.8.0' dist/mobile-v12.js
          grep -q '__TAREFAS_ANDROID_230_AI__' dist/mobile-ai-v230.js
          grep -q 'OFICIAL 2.3.0 · somente leitura' dist/mobile-ai-v230.js
          grep -q '__TAREFAS_V780_VERSION__' dist/v7_5_1_version.js
          grep -q 'Assistente IA chega ao TAREFAS' dist/v7_8_0_about.js
          ! grep -q 'GEMINI_API_KEY\|OPENAI_API_KEY\|sk-proj-' dist/mobile-ai-v230.js

      - name: Baixar configuração Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Configurar versão e Firebase
        run: |
          cp app/google-services.json android/app/google-services.json
          sed -i 's/versionCode 1/versionCode 230/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.3.0"/' android/app/build.gradle

      - name: Gerar ícones Android
        run: npm run assets:android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar armazenamento nativo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions='''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'''
          if 'android.permission.READ_EXTERNAL_STORAGE' not in s:s=s.replace('<application',permissions+'    <application',1)
          if 'android:requestLegacyExternalStorage' not in s:s=s.replace('<application','<application android:requestLegacyExternalStorage="true"',1)
          p.write_text(s,encoding='utf-8')
          xml=Path('android/app/src/main/res/xml');xml.mkdir(parents=True,exist_ok=True)
          (xml/'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n  <files-path name="files" path="." />\n  <cache-path name="cache" path="." />\n  <external-files-path name="external-files" path="." />\n  <external-cache-path name="external-cache" path="." />\n  <external-path name="external" path="." />\n</paths>\n''',encoding='utf-8')
          PY
          JAVA_DIR='android/app/src/main/java/br/com/guerravpn/tarefas/mobile'
          mkdir -p "$JAVA_DIR"
          cp app/android/StorageAccessPlugin.java "$JAVA_DIR/StorageAccessPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.guerravpn.tarefas.mobile;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Validar APK Release 2.3.0
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          unzip -tq "$APK"
          python3 - <<'PY'
          import json
          with open('android/app/build/outputs/apk/release/output-metadata.json',encoding='utf-8') as f: el=json.load(f)['elements'][0]
          assert int(el['versionCode'])==230,el
          assert str(el['versionName'])=='2.3.0',el
          PY
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -1)"
          test -n "$APKANALYZER"
          test "$("$APKANALYZER" manifest debuggable "$APK" | tr -d '\r\n')" = 'false'
          unzip -p "$APK" assets/public/mobile-v12.js | grep -q '2.3.0 • WEB 7.8.0'
          unzip -p "$APK" assets/public/mobile-ai-v230.js | grep -q '__TAREFAS_ANDROID_230_AI__'
          unzip -p "$APK" assets/public/mobile-ai-v230.js | grep -q '/functions/v1/tarefas-ai'
          unzip -p "$APK" assets/public/v7_5_1_version.js | grep -q "VERSION='7.8.0'"
          ! unzip -l "$APK" | grep -q 'assets/public/mobile-ai-v228.js'

      - name: Alinhar e assinar APK GuerraVPN
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' -o "$RUNNER_TEMP/tarefas-signing.json"
          jq -r '.keystore_b64' "$RUNNER_TEMP/tarefas-signing.json" | base64 -d > "$RUNNER_TEMP/GuerraVPN.keystore"
          STORE_PASS="$(jq -r '.store_password' "$RUNNER_TEMP/tarefas-signing.json")"
          KEY_ALIAS="$(jq -r '.key_alias' "$RUNNER_TEMP/tarefas-signing.json")"
          KEY_PASS="$(jq -r '.key_password' "$RUNNER_TEMP/tarefas-signing.json")"
          EXPECTED_CERT="$(jq -r '.cert_sha256' "$RUNNER_TEMP/tarefas-signing.json")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/TAREFAS-2.3.0-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/GuerraVPN.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out TAREFAS-2.3.0.apk "$RUNNER_TEMP/TAREFAS-2.3.0-aligned.apk"
          VERIFY="$($APKSIGNER verify --verbose --print-certs TAREFAS-2.3.0.apk)"
          printf '%s\n' "$VERIFY"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          rm -f "$RUNNER_TEMP/tarefas-signing.json" "$RUNNER_TEMP/GuerraVPN.keystore" "$RUNNER_TEMP/TAREFAS-2.3.0-aligned.apk"

      - name: Publicar APK permanente
        run: |
          set -euo pipefail
          git fetch origin app/releases
          RELEASES_DIR="$RUNNER_TEMP/tarefas-releases"
          git worktree add "$RELEASES_DIR" origin/app/releases
          mkdir -p "$RELEASES_DIR/downloads"
          cp TAREFAS-2.3.0.apk "$RELEASES_DIR/downloads/TAREFAS-2.3.0.apk"
          cd "$RELEASES_DIR"
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add downloads/TAREFAS-2.3.0.apk
          if ! git diff --cached --quiet; then git commit -m 'release(android): TAREFAS 2.3.0 official build 230';git push origin HEAD:app/releases;fi
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.0.apk'
          LOCAL_SHA="$(sha256sum "$GITHUB_WORKSPACE/TAREFAS-2.3.0.apk" | awk '{print $1}')"
          for attempt in 1 2 3 4 5 6 7 8;do if curl --fail --silent --show-error -L "$URL" -o "$RUNNER_TEMP/tarefas-published.apk";then test "$(sha256sum "$RUNNER_TEMP/tarefas-published.apk" | awk '{print $1}')" = "$LOCAL_SHA" && exit 0;fi;sleep 3;done
          exit 1

      - name: Registrar oficial e anunciar Assistente IA
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-2.3.0.apk | awk '{print $1}')"
          jq -n --arg version '2.3.0' --argjson build 230 --arg channel 'official' --arg web_version '7.8.0' --arg title 'TAREFAS 2.3.0 — Assistente IA' --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.0.apk' --arg sha "$SHA" '{version:$version,build:$build,channel:$channel,web_version:$web_version,title:$title,changelog:["✨ Novo Assistente IA oficial no TAREFAS: faça perguntas e peça ajuda com textos diretamente pelo balão IA.","A IA usa a sessão do TAREFAS e a chave do provedor permanece protegida no backend, fora do APK.","Adicionada proteção contra excesso de mensagens para preservar a cota gratuita da IA.","A IA permanece em modo somente leitura nesta primeira versão oficial e ainda não altera dados internos.","Consolida as correções das betas 2.2.x, incluindo Material Carga, estabilidade, notificações e exportações PDF/ODT.","Base Web atualizada para 7.8.0."],mandatory:false,download_url:$url,sha256:$sha}' > "$RUNNER_TEMP/release.json"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish' -o "$RUNNER_TEMP/release-result.json"
          cat "$RUNNER_TEMP/release-result.json"
          jq -e '.ok == true and .version == "2.3.0" and .build == 230 and .channel == "official"' "$RUNNER_TEMP/release-result.json" >/dev/null

      - name: Salvar APK oficial assinado
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.0-official-GuerraVPN
          path: TAREFAS-2.3.0.apk
          if-no-files-found: error
