name: Android 1.9.5 Prep Check

on:
  push:
    branches: [app/android-v195-prep]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build mobile bundle
        run: npm run build:web
      - name: Verify mobile bundle
        run: npm run verify:web
      - name: Verify download progress payload
        run: |
          grep -q '1.9.5 • WEB 7.5.7' dist/mobile-v12.js
          grep -q 'tarefas:update-download-progress' dist/native-mobile.js
          grep -q 'tmUpdateProgressBar' dist/mobile-updates-v181.js
          grep -q 'tmUpdateProgressSpeed' dist/mobile-updates-v181.js
          grep -q 'tmUpdateProgressEta' dist/mobile-updates-v181.js
          grep -q 'progress:!0' dist/native-mobile.js
