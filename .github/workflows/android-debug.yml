name: Android Beta APK

on:
  workflow_dispatch:
  push:
    branches: [app/android-v226-prep]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout fonte 2.2.6
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit

      - name: Gerar e validar Web 7.7.2 — 3 conferências
        run: |
          set -euo pipefail
          npm run build:web
          npm run verify:web
          grep -q '2.2.6 • WEB 7.7.2' dist/mobile-v12.js
          grep -q 'v7_7_1_autenticar_usuario' dist/index.html
          grep -q 'v7_7_1_autenticar_usuario' dist/mobile-login-v17.js
          grep -q '__TAREFAS_V226_LIGHT_LOADER__' dist/v6_2_mobile.js
          grep -q 'moduloCargaAtivo' dist/v7_7_0_material_carga.js
          grep -q '__TAREFAS_V772_SCALE_EXPORT__' dist/v7_7_2_scale_export.js
          grep -q 'application/vnd.oasis.opendocument.text' dist/v7_7_2_scale_export.js

      - name: Baixar configuração Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' \
            -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Configurar versão e Firebase
        run: |
          cp app/google-services.json android/app/google-services.json
          sed -i 's/versionCode 1/versionCode 226/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.2.6"/' android/app/build.gradle

      - name: Gerar ícones Android
        run: npm run assets:android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar armazenamento nativo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          source = p.read_text(encoding='utf-8')
          permissions = '''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
          '''
          if 'android.permission.READ_EXTERNAL_STORAGE' not in source:
              source = source.replace('<application', permissions + '    <application', 1)
          if 'android:requestLegacyExternalStorage' not in source:
              source = source.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          p.write_text(source, encoding='utf-8')
          xml = Path('android/app/src/main/res/xml')
          xml.mkdir(parents=True, exist_ok=True)
          (xml / 'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <files-path name="files" path="." />
            <cache-path name="cache" path="." />
            <external-files-path name="external-files" path="." />
            <external-cache-path name="external-cache" path="." />
            <external-path name="external" path="." />
          </paths>
          ''', encoding='utf-8')
          PY
          JAVA_DIR='android/app/src/main/java/br/com/guerravpn/tarefas/mobile'
          mkdir -p "$JAVA_DIR"
          cp app/android/StorageAccessPlugin.java "$JAVA_DIR/StorageAccessPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.guerravpn.tarefas.mobile;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Validar APK 2.2.6
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tq "$APK"
          python3 - <<'PY'
          import json
          with open('android/app/build/outputs/apk/debug/output-metadata.json', encoding='utf-8') as f:
              element = json.load(f)['elements'][0]
          assert int(element['versionCode']) == 226, element
          assert str(element['versionName']) == '2.2.6', element
          PY
          unzip -p "$APK" assets/public/mobile-v12.js | grep -q '2.2.6 • WEB 7.7.2'
          unzip -p "$APK" assets/public/mobile-login-v17.js | grep -q 'v7_7_1_autenticar_usuario'
          unzip -p "$APK" assets/public/v7_5_1_version.js | grep -q "VERSION='7.7.2'"
          unzip -p "$APK" assets/public/v6_2_mobile.js | grep -q '__TAREFAS_V226_LIGHT_LOADER__'
          unzip -p "$APK" assets/public/v7_7_0_material_carga.js | grep -q 'moduloCargaAtivo'
          unzip -p "$APK" assets/public/v7_7_2_scale_export.js | grep -q '__TAREFAS_V772_SCALE_EXPORT__'
          unzip -p "$APK" assets/public/v7_7_2_scale_export.js | grep -q 'application/vnd.oasis.opendocument.text'

      - name: Assinar APK de distribuição
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' \
            -o "$RUNNER_TEMP/tarefas-signing.json"
          jq -r '.keystore_b64' "$RUNNER_TEMP/tarefas-signing.json" | base64 -d > "$RUNNER_TEMP/GuerraVPN.keystore"
          STORE_PASS="$(jq -r '.store_password' "$RUNNER_TEMP/tarefas-signing.json")"
          KEY_ALIAS="$(jq -r '.key_alias' "$RUNNER_TEMP/tarefas-signing.json")"
          KEY_PASS="$(jq -r '.key_password' "$RUNNER_TEMP/tarefas-signing.json")"
          EXPECTED_CERT="$(jq -r '.cert_sha256' "$RUNNER_TEMP/tarefas-signing.json")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/GuerraVPN.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out TAREFAS-2.2.6.apk \
            android/app/build/outputs/apk/debug/app-debug.apk
          VERIFY="$($APKSIGNER verify --verbose --print-certs TAREFAS-2.2.6.apk)"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          rm -f "$RUNNER_TEMP/tarefas-signing.json" "$RUNNER_TEMP/GuerraVPN.keystore"

      - name: Publicar APK permanente
        run: |
          set -euo pipefail
          git fetch origin app/releases
          RELEASES_DIR="$RUNNER_TEMP/tarefas-releases"
          git worktree add "$RELEASES_DIR" origin/app/releases
          mkdir -p "$RELEASES_DIR/downloads"
          cp TAREFAS-2.2.6.apk "$RELEASES_DIR/downloads/TAREFAS-2.2.6.apk"
          cd "$RELEASES_DIR"
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add downloads/TAREFAS-2.2.6.apk
          if ! git diff --cached --quiet; then
            git commit -m 'release(android): TAREFAS 2.2.6 beta build 226'
            git push origin HEAD:app/releases
          fi
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.2.6.apk'
          LOCAL_SHA="$(sha256sum "$GITHUB_WORKSPACE/TAREFAS-2.2.6.apk" | awk '{print $1}')"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error -L "$URL" -o "$RUNNER_TEMP/tarefas-published.apk"; then
              test "$(sha256sum "$RUNNER_TEMP/tarefas-published.apk" | awk '{print $1}')" = "$LOCAL_SHA" && exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Registrar beta e enviar notificação
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-2.2.6.apk | awk '{print $1}')"
          jq -n \
            --arg version '2.2.6' \
            --argjson build 226 \
            --arg channel 'beta' \
            --arg web_version '7.7.2' \
            --arg title 'Exportação de escalas em PDF e ODT' \
            --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.2.6.apk' \
            --arg sha "$SHA" \
            '{version:$version,build:$build,channel:$channel,web_version:$web_version,title:$title,changelog:["Escala de Serviço agora pode ser gerada em PDF ou ODT editável.","Escala de Missão agora pode ser gerada em PDF ou ODT editável.","No Android, os arquivos usam o salvamento nativo em Downloads/TAREFAS.","Mantidas as correções de desempenho e as regras de Material Carga da beta 2.2.5.","O APK valida a presença do gerador ODT antes da assinatura e publicação."],mandatory:false,download_url:$url,sha256:$sha}' \
            > "$RUNNER_TEMP/release.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $OIDC" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/release.json" \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish' \
            -o "$RUNNER_TEMP/release-result.json"
          jq -e '.ok == true and .version == "2.2.6" and .build == 226 and .channel == "beta"' \
            "$RUNNER_TEMP/release-result.json" >/dev/null

      - name: Salvar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.2.6-beta-GuerraVPN
          path: TAREFAS-2.2.6.apk
          if-no-files-found: error
