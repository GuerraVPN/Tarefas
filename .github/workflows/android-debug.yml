name: Android Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - app/android-v1
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle 1.8.1 beta
        run: npm run build:web

      - name: Conferência 1 - auditoria do bundle 1.8.1
        run: npm run verify:web

      - name: Gerar ZIP 1.8.1
        run: |
          rm -f TAREFAS-1.8.1-web.zip
          cd dist
          zip -qr ../TAREFAS-1.8.1-web.zip .

      - name: Conferência 2 - validar ZIP 1.8.1
        run: |
          unzip -tq TAREFAS-1.8.1-web.zip
          rm -rf /tmp/tarefas-181
          mkdir -p /tmp/tarefas-181
          unzip -q TAREFAS-1.8.1-web.zip -d /tmp/tarefas-181
          node scripts/verify-mobile-build.mjs /tmp/tarefas-181
          grep -q '1.8.1 • WEB 7.5.2' /tmp/tarefas-181/mobile-v12.js
          grep -q 'tarefasAppBuild = '\''181'\''' /tmp/tarefas-181/mobile-preload.js
          grep -q 'v1_8_get_beta_updates' /tmp/tarefas-181/mobile-updates-v181.js
          grep -q 'v1_8_set_beta_updates' /tmp/tarefas-181/mobile-updates-v181.js
          grep -q 'v1_8_latest_app_version' /tmp/tarefas-181/mobile-updates-v181.js
          grep -q 'v1_8_app_version_history' /tmp/tarefas-181/mobile-updates-v181.js
          grep -q 'Receber versões beta' /tmp/tarefas-181/mobile-updates-v181.js
          grep -q 'Baixar atualização' /tmp/tarefas-181/mobile-updates-v181.js
          grep -q 'v1_7_registrar_push_device' /tmp/tarefas-181/native-mobile.js
          grep -q 'tarefas:file-saved' /tmp/tarefas-181/native-mobile.js

      - name: Upload ZIP 1.8.1 conferido
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.1-beta-web-checked
          path: TAREFAS-1.8.1-web.zip
          if-no-files-found: error

      - name: Conferir Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' \
            -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json
          grep -q 'tarefas-561c8' app/google-services.json
          grep -q 'current_key' app/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Configurar acesso a arquivos Android
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions='''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n'''
          if 'android.permission.READ_EXTERNAL_STORAGE' not in s:
              s=s.replace('<application', permissions+'    <application', 1)
          if 'android:requestLegacyExternalStorage' not in s:
              s=s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'WRITE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml

      - name: Instalar Firebase no projeto Android
        run: cp app/google-services.json android/app/google-services.json

      - name: Set Android app version
        run: |
          sed -i 's/versionCode 1/versionCode 181/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.8.1"/' android/app/build.gradle

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/tarefas-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Generate Android icon assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Conferência 3 - validar APK 1.8.1 beta
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'

          echo '[3.1] Integridade do APK'
          test -s "$APK"
          unzip -tq "$APK"

          echo '[3.2] Versionamento Android'
          python - <<'PY'
          import json
          with open('android/app/build/outputs/apk/debug/output-metadata.json', encoding='utf-8') as f:
              meta=json.load(f)
          el=meta['elements'][0]
          assert int(el['versionCode']) == 181, el
          assert str(el['versionName']) == '1.8.1', el
          print('versionCode=181 / versionName=1.8.1 BETA OK')
          PY

          echo '[3.3] Bundle, updates, push e arquivos dentro do APK'
          unzip -p "$APK" assets/public/mobile-bootstrap.js > /tmp/181-bootstrap.js
          unzip -p "$APK" assets/public/mobile-v12.js > /tmp/181-mobile-ui.js
          unzip -p "$APK" assets/public/mobile-preload.js > /tmp/181-preload.js
          unzip -p "$APK" assets/public/mobile-updates-v181.js > /tmp/181-updates.js
          unzip -p "$APK" assets/public/mobile-v181.css > /tmp/181-updates.css
          unzip -p "$APK" assets/public/native-mobile.js > /tmp/181-native.js
          grep -q "APP_VERSION = '1.8.1'" /tmp/181-bootstrap.js
          grep -q 'APP_BUILD = 181' /tmp/181-bootstrap.js
          grep -q '1.8.1 • WEB 7.5.2' /tmp/181-mobile-ui.js
          grep -q "APP_CHANNEL = 'beta'" /tmp/181-updates.js
          grep -q 'v1_8_get_beta_updates' /tmp/181-updates.js
          grep -q 'v1_8_set_beta_updates' /tmp/181-updates.js
          grep -q 'v1_8_latest_app_version' /tmp/181-updates.js
          grep -q 'v1_8_app_version_history' /tmp/181-updates.js
          grep -q 'Receber versões beta' /tmp/181-updates.js
          grep -q 'Baixar atualização' /tmp/181-updates.js
          grep -q '.tm-update-history' /tmp/181-updates.css
          grep -q '.tm-switch' /tmp/181-updates.css
          grep -q 'v1_7_emitir_sessao_push' /tmp/181-preload.js
          grep -q 'v1_7_registrar_push_device' /tmp/181-native.js
          grep -q 'pushNotificationActionPerformed' /tmp/181-native.js
          grep -q 'tarefas:file-saved' /tmp/181-native.js
          grep -q 'Salvar ou abrir arquivo' /tmp/181-native.js
          if grep -q 'new MutationObserver' /tmp/181-mobile-ui.js /tmp/181-bootstrap.js /tmp/181-updates.js; then
            echo 'ERRO: observer recursivo encontrado dentro do APK'
            exit 1
          fi

          echo '[3.4] Recursos Firebase processados pelo Gradle'
          GS="$(grep -rl --include='*.xml' 'google_app_id' android/app/build/generated | head -1)"
          test -n "$GS"
          test -s "$GS"
          grep -q 'google_app_id' "$GS"
          grep -q 'gcm_defaultSenderId' "$GS"
          grep -q 'google_api_key' "$GS"

          echo '[3.5] Permissões de arquivos'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" > /tmp/181-permissions.txt
          grep -q 'android.permission.READ_EXTERNAL_STORAGE' /tmp/181-permissions.txt
          grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' /tmp/181-permissions.txt

          echo '[3.6] Assinatura de build e hash'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK 1.8.1 beta
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.1-beta-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Empacotar ferramenta de assinatura Android
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          TOOL_DIR="$(dirname "$APKSIGNER")"
          rm -rf /tmp/tarefas-apksigner
          mkdir -p /tmp/tarefas-apksigner
          cp "$APKSIGNER" /tmp/tarefas-apksigner/apksigner
          cp -R "$TOOL_DIR/lib" /tmp/tarefas-apksigner/lib
          tar -C /tmp -czf android-sign-tools.tgz tarefas-apksigner

      - name: Upload ferramenta de assinatura
        uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools
          path: android-sign-tools.tgz
          if-no-files-found: error
