name: Android Beta APK

on:
  push:
    branches: [app/android-v194-prep]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build web bundle 1.9.4 beta
        run: npm run build:web
      - name: Conferência do bundle 1.9.4
        run: npm run verify:web
      - name: Conferir Web 7.5.7
        run: |
          grep -q '1.9.4 • WEB 7.5.7' dist/mobile-v12.js
          grep -q "const WEB_VERSION = '7.5.7'" dist/mobile-bootstrap.js
          grep -q '__TAREFAS_V757_PATCH__' dist/v7_5_7_patch.js
          grep -q 'v757ScaleThemeFix' dist/v7_5_7_patch.js
          grep -q 'v7_5_7_patch.js' dist/v7_5_1_version.js
