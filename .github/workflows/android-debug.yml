name: Android Beta APK

on:
  workflow_dispatch:
  push:
    branches: [app/android-v197-prep]
    paths:
      - '.github/workflows/android-debug.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout fluxo autorizado
        uses: actions/checkout@v4
        with:
          ref: app/android-v197-prep

      - name: Verificar APK 2.2.2 publicado
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.2.2.apk'
          curl --fail --silent --show-error -L "$URL" -o /tmp/TAREFAS-2.2.2.apk
          test -s /tmp/TAREFAS-2.2.2.apk
          unzip -tq /tmp/TAREFAS-2.2.2.apk
          unzip -p /tmp/TAREFAS-2.2.2.apk assets/public/mobile-v12.js | grep -q '2.2.2 • WEB 7.6.11'
          unzip -p /tmp/TAREFAS-2.2.2.apk assets/public/menu.html | grep -q 'atualizado_por:Number(usuarioLogado.id)'

      - name: Registrar beta e enviar push
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum /tmp/TAREFAS-2.2.2.apk | awk '{print $1}')"
          jq -n --arg version '2.2.2' --argjson build 222 --arg channel 'beta' --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.2.2.apk' --arg sha "$SHA" '{version:$version,build:$build,channel:$channel,download_url:$url,sha256:$sha}' > /tmp/release.json
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/release.json 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish' -o /tmp/release-result.json
          cat /tmp/release-result.json
          jq -e '.ok == true and .version == "2.2.2" and .build == 222 and .channel == "beta"' /tmp/release-result.json >/dev/null
