name: Android Beta APK

on:
  workflow_dispatch:
  push:
    branches: [app/android-v1]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle 1.8.6 beta
        run: npm run build:web

      - name: Conferência 1 - auditoria do bundle 1.8.6
        run: npm run verify:web

      - name: Gerar ZIP 1.8.6
        run: |
          rm -f TAREFAS-1.8.6-web.zip
          cd dist && zip -qr ../TAREFAS-1.8.6-web.zip .

      - name: Conferência 2 - validar ZIP 1.8.6
        run: |
          set -euo pipefail
          unzip -tq TAREFAS-1.8.6-web.zip
          rm -rf /tmp/tarefas-186 && mkdir -p /tmp/tarefas-186
          unzip -q TAREFAS-1.8.6-web.zip -d /tmp/tarefas-186
          node scripts/verify-mobile-build.mjs /tmp/tarefas-186
          grep -q '1.8.6 • WEB 7.5.4' /tmp/tarefas-186/mobile-v12.js
          grep -q "tarefasAppBuild = '186'" /tmp/tarefas-186/mobile-preload.js
          grep -q "VERSION='7.5.4'" /tmp/tarefas-186/v7_5_1_version.js
          grep -q 'v7_5_4_patch.js' /tmp/tarefas-186/v7_5_1_version.js
          grep -q 'v754-scale-page' /tmp/tarefas-186/v7_5_4_patch.js
          grep -q 'v754AppLogout' /tmp/tarefas-186/v7_5_4_patch.js
          grep -q 'v754SiteAppUpdates' /tmp/tarefas-186/v7_5_4_patch.js
          grep -q "executor.textContent='TS'" /tmp/tarefas-186/v7_5_2_service_labels.js
          grep -q 'Baixar e instalar atualização' /tmp/tarefas-186/mobile-updates-v181.js
          grep -q 'reusedExisting' /tmp/tarefas-186/native-mobile.js
          grep -q 'openFile' /tmp/tarefas-186/native-mobile.js
          grep -q 'Próximo serviço' /tmp/tarefas-186/mobile-dashboard-v184.js

      - name: Upload ZIP 1.8.6 conferido
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.6-beta-web-checked
          path: TAREFAS-1.8.6-web.zip
          if-no-files-found: error

      - name: Conferir Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json
          grep -q 'tarefas-561c8' app/google-services.json
          grep -q 'current_key' app/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Configurar arquivos e instalador Android
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions='''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'''
          if 'android.permission.READ_EXTERNAL_STORAGE' not in s:
              s=s.replace('<application', permissions+'    <application', 1)
          elif 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s=s.replace('<application', '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          if 'android:requestLegacyExternalStorage' not in s:
              s=s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          p.write_text(s,encoding='utf-8')
          xml=Path('android/app/src/main/res/xml');xml.mkdir(parents=True,exist_ok=True)
          (xml/'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n  <files-path name="files" path="." />\n  <cache-path name="cache" path="." />\n  <external-files-path name="external-files" path="." />\n  <external-cache-path name="external-cache" path="." />\n  <external-path name="external" path="." />\n</paths>\n''',encoding='utf-8')
          PY
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'external-path' android/app/src/main/res/xml/file_paths.xml

      - name: Instalar Firebase no projeto Android
        run: cp app/google-services.json android/app/google-services.json

      - name: Set Android app version
        run: |
          sed -i 's/versionCode 1/versionCode 186/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.8.6"/' android/app/build.gradle

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/tarefas-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Generate Android icon assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Conferir plugins de atualização Android
        run: |
          grep -R -q 'capacitor-file-transfer' android/settings.gradle android/capacitor.settings.gradle 2>/dev/null || grep -R -q 'FileTransfer' android 2>/dev/null
          grep -R -q 'capacitor-file-opener' android/settings.gradle android/capacitor.settings.gradle 2>/dev/null || grep -R -q 'FileOpener' android 2>/dev/null
          test -s android/app/src/main/res/xml/file_paths.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Conferência 3 - validar APK 1.8.6 beta
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK" && unzip -tq "$APK"
          python - <<'PY'
          import json
          with open('android/app/build/outputs/apk/debug/output-metadata.json',encoding='utf-8') as f: el=json.load(f)['elements'][0]
          assert int(el['versionCode'])==186,el
          assert str(el['versionName'])=='1.8.6',el
          print('versionCode=186 / versionName=1.8.6 BETA OK')
          PY
          unzip -p "$APK" assets/public/mobile-bootstrap.js > /tmp/186-bootstrap.js
          unzip -p "$APK" assets/public/mobile-v12.js > /tmp/186-ui.js
          unzip -p "$APK" assets/public/mobile-preload.js > /tmp/186-preload.js
          unzip -p "$APK" assets/public/mobile-updates-v181.js > /tmp/186-updates.js
          unzip -p "$APK" assets/public/mobile-dashboard-v184.js > /tmp/186-dashboard.js
          unzip -p "$APK" assets/public/native-mobile.js > /tmp/186-native.js
          unzip -p "$APK" assets/public/v7_5_4_patch.js > /tmp/186-web754.js
          unzip -p "$APK" assets/public/v7_5_2_service_labels.js > /tmp/186-labels.js
          grep -q "APP_VERSION = '1.8.6'" /tmp/186-bootstrap.js
          grep -q 'APP_BUILD = 186' /tmp/186-bootstrap.js
          grep -q '1.8.6 • WEB 7.5.4' /tmp/186-ui.js
          grep -q 'APP_BUILD = 186' /tmp/186-updates.js
          grep -q 'Baixar e instalar atualização' /tmp/186-updates.js
          grep -q 'Próximo serviço' /tmp/186-dashboard.js
          grep -q "substituted?'TS'" /tmp/186-dashboard.js
          grep -q 'v1_7_registrar_push_device' /tmp/186-native.js
          grep -q 'reusedExisting' /tmp/186-native.js
          grep -q 'openFile' /tmp/186-native.js
          grep -q 'v754-scale-page' /tmp/186-web754.js
          grep -q 'modalNovaTarefa' /tmp/186-web754.js
          grep -q 'v754-users-inline' /tmp/186-web754.js
          grep -q 'v754AppLogout' /tmp/186-web754.js
          grep -q 'Sair da conta' /tmp/186-web754.js
          grep -q "executor.textContent='TS'" /tmp/186-labels.js
          GS="$(grep -rl --include='*.xml' 'google_app_id' android/app/build/generated | head -1)"
          test -n "$GS" && grep -q 'gcm_defaultSenderId' "$GS" && grep -q 'google_api_key' "$GS"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions "$APK" > /tmp/186-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/186-permissions.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Assinar distribuição com GuerraVPN
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' -o /tmp/tarefas-signing.json
          jq -r '.keystore_b64' /tmp/tarefas-signing.json | base64 -d > /tmp/GuerraVPN.keystore
          STORE_PASS="$(jq -r '.store_password' /tmp/tarefas-signing.json)"; KEY_ALIAS="$(jq -r '.key_alias' /tmp/tarefas-signing.json)"; KEY_PASS="$(jq -r '.key_password' /tmp/tarefas-signing.json)"; EXPECTED_CERT="$(jq -r '.cert_sha256' /tmp/tarefas-signing.json)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign --ks /tmp/GuerraVPN.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out TAREFAS-1.8.6.apk android/app/build/outputs/apk/debug/app-debug.apk
          VERIFY="$($APKSIGNER verify --verbose --print-certs TAREFAS-1.8.6.apk)"; printf '%s\n' "$VERIFY"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          rm -f /tmp/tarefas-signing.json /tmp/GuerraVPN.keystore
          sha256sum TAREFAS-1.8.6.apk

      - name: Publicar APK permanente
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          git fetch origin app/releases
          rm -rf /tmp/tarefas-releases
          git worktree add /tmp/tarefas-releases origin/app/releases
          mkdir -p /tmp/tarefas-releases/downloads
          cp TAREFAS-1.8.6.apk /tmp/tarefas-releases/downloads/TAREFAS-1.8.6.apk
          cd /tmp/tarefas-releases
          git config user.name 'GuerraVPN Android Build'; git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add downloads/TAREFAS-1.8.6.apk
          if ! git diff --cached --quiet; then git commit -m 'release(android): TAREFAS 1.8.6 beta build 186'; git push origin HEAD:app/releases; fi
          cd -
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-1.8.6.apk'
          LOCAL_SHA="$(sha256sum TAREFAS-1.8.6.apk | awk '{print $1}')"
          for i in 1 2 3 4 5; do curl --fail --silent --show-error -L "$URL" -o /tmp/tarefas-published.apk && [ "$(sha256sum /tmp/tarefas-published.apk | awk '{print $1}')" = "$LOCAL_SHA" ] && exit 0; sleep 3; done
          exit 1

      - name: Registrar beta no servidor e disparar push
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-1.8.6.apk | awk '{print $1}')"
          jq -n --arg version '1.8.6' --argjson build 186 --arg channel 'beta' --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-1.8.6.apk' --arg sha "$SHA" '{version:$version,build:$build,channel:$channel,download_url:$url,sha256:$sha}' > /tmp/release.json
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/release.json 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish' -o /tmp/release-result.json
          jq -e '.ok == true and .version == "1.8.6" and .build == 186' /tmp/release-result.json >/dev/null

      - name: Upload APK 1.8.6 beta assinado
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.6-beta-GuerraVPN
          path: TAREFAS-1.8.6.apk
          if-no-files-found: error

      - name: Upload APK de conferência
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.6-beta-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
