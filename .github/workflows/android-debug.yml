name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - app/android-v1
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle V1.7
        run: npm run build:web

      - name: Conferência 1 - auditoria do bundle V1.7
        run: npm run verify:web

      - name: Gerar ZIP V1.7
        run: |
          rm -f TAREFAS-v1.7-web.zip
          cd dist
          zip -qr ../TAREFAS-v1.7-web.zip .

      - name: Conferência 2 - validar ZIP V1.7
        run: |
          unzip -tq TAREFAS-v1.7-web.zip
          rm -rf /tmp/tarefas-v17
          mkdir -p /tmp/tarefas-v17
          unzip -q TAREFAS-v1.7-web.zip -d /tmp/tarefas-v17
          node scripts/verify-mobile-build.mjs /tmp/tarefas-v17
          grep -q 'V1.7 • WEB 7.5.2' /tmp/tarefas-v17/mobile-v12.js
          grep -q '__TAREFAS_NATIVE_APP__' /tmp/tarefas-v17/mobile-preload.js
          grep -q 'v1_7_registrar_push_device' /tmp/tarefas-v17/native-mobile.js
          grep -q 'v1_7_emitir_sessao_push' /tmp/tarefas-v17/mobile-preload.js

      - name: Upload ZIP V1.7 conferido
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-v1.7-web-checked
          path: TAREFAS-v1.7-web.zip
          if-no-files-found: error

      - name: Conferir Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' \
            -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json
          grep -q 'tarefas-561c8' app/google-services.json
          grep -q 'current_key' app/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Instalar Firebase no projeto Android
        run: cp app/google-services.json android/app/google-services.json

      - name: Set Android app version
        run: |
          sed -i 's/versionCode 1/versionCode 17/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.7"/' android/app/build.gradle

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/tarefas-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Generate Android icon assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Conferência 3 - validar APK V1.7 + push
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          META='android/app/build/outputs/apk/debug/output-metadata.json'

          echo '[3.1] Integridade do APK'
          test -s "$APK"
          unzip -tq "$APK"

          echo '[3.2] Versionamento Android'
          python - <<'PY'
          import json
          with open('android/app/build/outputs/apk/debug/output-metadata.json', encoding='utf-8') as f:
              meta=json.load(f)
          el=meta['elements'][0]
          assert int(el['versionCode']) == 17, el
          assert str(el['versionName']) == '1.7', el
          print('versionCode=17 / versionName=1.7 OK')
          PY

          echo '[3.3] Bundle V1.7 dentro do APK'
          unzip -p "$APK" assets/public/mobile-v12.js > /tmp/v17-mobile-ui.js
          unzip -p "$APK" assets/public/mobile-preload.js > /tmp/v17-preload.js
          unzip -p "$APK" assets/public/native-mobile.js > /tmp/v17-native.js
          grep -q 'V1.7 • WEB 7.5.2' /tmp/v17-mobile-ui.js
          grep -q 'v1_7_emitir_sessao_push' /tmp/v17-preload.js
          grep -q 'v1_7_registrar_push_device' /tmp/v17-native.js
          grep -q 'PushNotifications' /tmp/v17-native.js || grep -q 'pushNotificationReceived' /tmp/v17-native.js
          if grep -q 'new MutationObserver' /tmp/v17-mobile-ui.js; then
            echo 'ERRO: observer recursivo encontrado dentro do APK'
            exit 1
          fi

          echo '[3.4] Recursos Firebase processados pelo Gradle'
          GS="$(find android/app/build/generated -type f -name values.xml -path '*google-services*' | head -1)"
          test -n "$GS"
          test -s "$GS"
          grep -q 'google_app_id' "$GS"
          grep -q 'gcm_defaultSenderId' "$GS"
          grep -q 'google_api_key' "$GS"
          echo "Firebase resources: $GS"

          echo '[3.5] Assinatura e hash'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK V1.7
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-v1.7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
