name: Android Beta APK

on:
  workflow_dispatch:
  push:
    branches: [app/android-v1]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle 1.8.9 beta
        run: npm run build:web

      - name: Conferência 1 - auditoria do bundle 1.8.9
        run: npm run verify:web

      - name: Gerar ZIP 1.8.9
        run: |
          rm -f TAREFAS-1.8.9-web.zip
          cd dist && zip -qr ../TAREFAS-1.8.9-web.zip .

      - name: Conferência 2 - validar ZIP 1.8.9
        run: |
          set -euo pipefail
          unzip -tq TAREFAS-1.8.9-web.zip
          rm -rf /tmp/tarefas-189 && mkdir -p /tmp/tarefas-189
          unzip -q TAREFAS-1.8.9-web.zip -d /tmp/tarefas-189
          node scripts/verify-mobile-build.mjs /tmp/tarefas-189
          grep -q '1.8.9 • WEB 7.5.5' /tmp/tarefas-189/mobile-v12.js
          grep -q "tarefasAppBuild = '189'" /tmp/tarefas-189/mobile-preload.js
          grep -q 'mobile-users-inline-v189.js' /tmp/tarefas-189/usuarios.html
          grep -q 'actionSequence' /tmp/tarefas-189/mobile-users-inline-v189.js
          grep -q 'restorePanels();' /tmp/tarefas-189/mobile-users-inline-v189.js
          grep -q 'sendToSource(other)' /tmp/tarefas-189/mobile-users-inline-v189.js
          grep -q 'sequence!==actionSequence' /tmp/tarefas-189/mobile-users-inline-v189.js
          ! grep -q 'mobile-users-inline-v188.js' /tmp/tarefas-189/usuarios.html

      - name: Upload ZIP 1.8.9 conferido
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.9-beta-web-checked
          path: TAREFAS-1.8.9-web.zip
          if-no-files-found: error

      - name: Conferir Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json
          grep -q 'tarefas-561c8' app/google-services.json
          grep -q 'current_key' app/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Instalar Firebase no projeto Android
        run: cp app/google-services.json android/app/google-services.json

      - name: Set Android app version
        run: |
          sed -i 's/versionCode 1/versionCode 189/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.8.9"/' android/app/build.gradle

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/tarefas-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Generate Android icon assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configurar armazenamento amplo e plugin nativo
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions='''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'''
          if 'android.permission.READ_EXTERNAL_STORAGE' not in s:
              s=s.replace('<application',permissions+'    <application',1)
          else:
              for line,needle in [
                ('    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n','android.permission.MANAGE_EXTERNAL_STORAGE'),
                ('    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n','android.permission.REQUEST_INSTALL_PACKAGES')]:
                if needle not in s:s=s.replace('<application',line+'    <application',1)
          if 'android:requestLegacyExternalStorage' not in s:
              s=s.replace('<application','<application android:requestLegacyExternalStorage="true"',1)
          p.write_text(s,encoding='utf-8')
          xml=Path('android/app/src/main/res/xml');xml.mkdir(parents=True,exist_ok=True)
          (xml/'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n  <files-path name="files" path="." />\n  <cache-path name="cache" path="." />\n  <external-files-path name="external-files" path="." />\n  <external-cache-path name="external-cache" path="." />\n  <external-path name="external" path="." />\n</paths>\n''',encoding='utf-8')
          PY
          JAVA_DIR='android/app/src/main/java/br/com/guerravpn/tarefas/mobile'
          mkdir -p "$JAVA_DIR"
          cp app/android/StorageAccessPlugin.java "$JAVA_DIR/StorageAccessPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.guerravpn.tarefas.mobile;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          grep -q 'MANAGE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION' "$JAVA_DIR/StorageAccessPlugin.java"
          grep -q 'MediaStore.Downloads' "$JAVA_DIR/StorageAccessPlugin.java"
          grep -q 'clearOldUpdates' "$JAVA_DIR/StorageAccessPlugin.java"
          grep -q 'registerPlugin(StorageAccessPlugin.class)' "$JAVA_DIR/MainActivity.java"

      - name: Conferir plugins Android
        run: |
          grep -R -q 'capacitor-file-transfer' android/settings.gradle android/capacitor.settings.gradle 2>/dev/null || grep -R -q 'FileTransfer' android 2>/dev/null
          grep -R -q 'capacitor-file-opener' android/settings.gradle android/capacitor.settings.gradle 2>/dev/null || grep -R -q 'FileOpener' android 2>/dev/null
          test -s android/app/src/main/res/xml/file_paths.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Conferência 3 - validar APK 1.8.9 beta
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK" && unzip -tq "$APK"
          python - <<'PY'
          import json
          with open('android/app/build/outputs/apk/debug/output-metadata.json',encoding='utf-8') as f: el=json.load(f)['elements'][0]
          assert int(el['versionCode'])==189,el
          assert str(el['versionName'])=='1.8.9',el
          print('versionCode=189 / versionName=1.8.9 BETA OK')
          PY
          unzip -p "$APK" assets/public/mobile-bootstrap.js > /tmp/189-bootstrap.js
          unzip -p "$APK" assets/public/mobile-v12.js > /tmp/189-ui.js
          unzip -p "$APK" assets/public/mobile-preload.js > /tmp/189-preload.js
          unzip -p "$APK" assets/public/mobile-updates-v181.js > /tmp/189-updates.js
          unzip -p "$APK" assets/public/mobile-users-inline-v189.js > /tmp/189-users-inline.js
          unzip -p "$APK" assets/public/native-mobile.js > /tmp/189-native.js
          unzip -p "$APK" assets/public/v7_5_4_patch.js > /tmp/189-web754.js
          grep -q "APP_VERSION = '1.8.9'" /tmp/189-bootstrap.js
          grep -q 'APP_BUILD = 189' /tmp/189-bootstrap.js
          grep -q '1.8.9 • WEB 7.5.5' /tmp/189-ui.js
          grep -q 'APP_BUILD = 189' /tmp/189-updates.js
          grep -q 'actionSequence' /tmp/189-users-inline.js
          grep -q 'restorePanels();' /tmp/189-users-inline.js
          grep -q 'sendToSource(other)' /tmp/189-users-inline.js
          grep -q 'sequence!==actionSequence' /tmp/189-users-inline.js
          grep -q 'tm-users-inline-source-189' /tmp/189-users-inline.js
          grep -q "page()!=='usuarios.html'||native()" /tmp/189-web754.js
          grep -q '1.8.9' /tmp/189-native.js
          grep -q 'StorageAccess' /tmp/189-native.js
          grep -q 'Downloads/TAREFAS' /tmp/189-native.js
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions "$APK" > /tmp/189-permissions.txt
          grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' /tmp/189-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/189-permissions.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Assinar distribuição com GuerraVPN
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' -o /tmp/tarefas-signing.json
          jq -r '.keystore_b64' /tmp/tarefas-signing.json | base64 -d > /tmp/GuerraVPN.keystore
          STORE_PASS="$(jq -r '.store_password' /tmp/tarefas-signing.json)"
          KEY_ALIAS="$(jq -r '.key_alias' /tmp/tarefas-signing.json)"
          KEY_PASS="$(jq -r '.key_password' /tmp/tarefas-signing.json)"
          EXPECTED_CERT="$(jq -r '.cert_sha256' /tmp/tarefas-signing.json)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign --ks /tmp/GuerraVPN.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out TAREFAS-1.8.9.apk android/app/build/outputs/apk/debug/app-debug.apk
          VERIFY="$($APKSIGNER verify --verbose --print-certs TAREFAS-1.8.9.apk)"
          printf '%s\n' "$VERIFY"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          rm -f /tmp/tarefas-signing.json /tmp/GuerraVPN.keystore
          sha256sum TAREFAS-1.8.9.apk

      - name: Publicar APK permanente
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          git fetch origin app/releases
          rm -rf /tmp/tarefas-releases
          git worktree add /tmp/tarefas-releases origin/app/releases
          mkdir -p /tmp/tarefas-releases/downloads
          cp TAREFAS-1.8.9.apk /tmp/tarefas-releases/downloads/TAREFAS-1.8.9.apk
          cd /tmp/tarefas-releases
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add downloads/TAREFAS-1.8.9.apk
          if ! git diff --cached --quiet; then
            git commit -m 'release(android): TAREFAS 1.8.9 beta build 189'
            git push origin HEAD:app/releases
          fi
          cd -
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-1.8.9.apk'
          LOCAL_SHA="$(sha256sum TAREFAS-1.8.9.apk | awk '{print $1}')"
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error -L "$URL" -o /tmp/tarefas-published.apk; then
              [ "$(sha256sum /tmp/tarefas-published.apk | awk '{print $1}')" = "$LOCAL_SHA" ] && echo 'APK permanente conferido.' && exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Registrar beta no servidor e disparar push
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-1.8.9.apk | awk '{print $1}')"
          jq -n --arg version '1.8.9' --argjson build 189 --arg channel 'beta' --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-1.8.9.apk' --arg sha "$SHA" '{version:$version,build:$build,channel:$channel,download_url:$url,sha256:$sha}' > /tmp/release.json
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/release.json 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish' -o /tmp/release-result.json
          cat /tmp/release-result.json
          jq -e '.ok == true and .version == "1.8.9" and .build == 189' /tmp/release-result.json >/dev/null

      - name: Upload APK 1.8.9 beta assinado
        if: github.event_name == 'push' && github.ref == 'refs/heads/app/android-v1'
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.9-beta-GuerraVPN
          path: TAREFAS-1.8.9.apk
          if-no-files-found: error

      - name: Upload APK de conferência
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.9-debug-check
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
