name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - app/android-v1
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
      - '*.html'
      - '*.js'
      - '*.css'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle 1.8.0
        run: npm run build:web

      - name: Conferência 1 - auditoria do bundle 1.8.0
        run: npm run verify:web

      - name: Gerar ZIP 1.8.0
        run: |
          rm -f TAREFAS-1.8.0-web.zip
          cd dist
          zip -qr ../TAREFAS-1.8.0-web.zip .

      - name: Conferência 2 - validar ZIP 1.8.0
        run: |
          unzip -tq TAREFAS-1.8.0-web.zip
          rm -rf /tmp/tarefas-180
          mkdir -p /tmp/tarefas-180
          unzip -q TAREFAS-1.8.0-web.zip -d /tmp/tarefas-180
          node scripts/verify-mobile-build.mjs /tmp/tarefas-180
          grep -q '1.8.0 • WEB 7.5.2' /tmp/tarefas-180/mobile-v12.js
          grep -q 'tarefasAppBuild = '\''180'\''' /tmp/tarefas-180/mobile-preload.js
          grep -q 'Desrelacionamento / Baixa' /tmp/tarefas-180/mobile-bootstrap.js
          grep -q 'Sobre o app' /tmp/tarefas-180/mobile-bootstrap.js
          grep -q '#tmDrawer .tm-drawer-item' /tmp/tarefas-180/mobile-v18.css
          grep -q 'v1_7_registrar_push_device' /tmp/tarefas-180/native-mobile.js

      - name: Upload ZIP 1.8.0 conferido
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.0-web-checked
          path: TAREFAS-1.8.0-web.zip
          if-no-files-found: error

      - name: Conferir Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 \
            'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' \
            -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json
          grep -q 'tarefas-561c8' app/google-services.json
          grep -q 'current_key' app/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Instalar Firebase no projeto Android
        run: cp app/google-services.json android/app/google-services.json

      - name: Set Android app version
        run: |
          sed -i 's/versionCode 1/versionCode 180/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.8.0"/' android/app/build.gradle

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/tarefas-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Generate Android icon assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Conferência 3 - validar APK 1.8.0 + layout + push
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'

          echo '[3.1] Integridade do APK'
          test -s "$APK"
          unzip -tq "$APK"

          echo '[3.2] Versionamento Android'
          python - <<'PY'
          import json
          with open('android/app/build/outputs/apk/debug/output-metadata.json', encoding='utf-8') as f:
              meta=json.load(f)
          el=meta['elements'][0]
          assert int(el['versionCode']) == 180, el
          assert str(el['versionName']) == '1.8.0', el
          print('versionCode=180 / versionName=1.8.0 OK')
          PY

          echo '[3.3] Bundle 1.8.0 dentro do APK'
          unzip -p "$APK" assets/public/mobile-bootstrap.js > /tmp/180-bootstrap.js
          unzip -p "$APK" assets/public/mobile-v12.js > /tmp/180-mobile-ui.js
          unzip -p "$APK" assets/public/mobile-preload.js > /tmp/180-preload.js
          unzip -p "$APK" assets/public/mobile-v18.css > /tmp/180-layout.css
          unzip -p "$APK" assets/public/native-mobile.js > /tmp/180-native.js
          grep -q "APP_VERSION = '1.8.0'" /tmp/180-bootstrap.js
          grep -q 'APP_BUILD = 180' /tmp/180-bootstrap.js
          grep -q '1.8.0 • WEB 7.5.2' /tmp/180-mobile-ui.js
          grep -q 'Desrelacionamento / Baixa' /tmp/180-bootstrap.js
          grep -q 'Sobre o app' /tmp/180-bootstrap.js
          grep -q 'tm-about-page' /tmp/180-bootstrap.js
          grep -q '#tmDrawer .tm-drawer-item' /tmp/180-layout.css
          grep -q 'v1_7_emitir_sessao_push' /tmp/180-preload.js
          grep -q 'v1_7_registrar_push_device' /tmp/180-native.js
          grep -q 'pushNotificationActionPerformed' /tmp/180-native.js
          if grep -q 'new MutationObserver' /tmp/180-mobile-ui.js /tmp/180-bootstrap.js; then
            echo 'ERRO: observer recursivo encontrado dentro do APK'
            exit 1
          fi

          echo '[3.4] Recursos Firebase processados pelo Gradle'
          GS="$(grep -rl --include='*.xml' 'google_app_id' android/app/build/generated | head -1)"
          test -n "$GS"
          test -s "$GS"
          grep -q 'google_app_id' "$GS"
          grep -q 'gcm_defaultSenderId' "$GS"
          grep -q 'google_api_key' "$GS"

          echo '[3.5] Assinatura de build e hash'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK 1.8.0
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-1.8.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
