name: Verify patch 2.4.6.2
on:
  workflow_dispatch:
  push:
    branches: [app/releases]
    paths:
      - '.github/workflows/verify-patch-2462.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/releases
      - name: Compute with Node exactly like Patch Manager
        run: |
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const path='patches/TAREFAS-2.4.6.2-r2.tpatch';
          const p=JSON.parse(fs.readFileSync(path,'utf8'));
          const payloadText=p=>JSON.stringify({js:String(p?.js||''),css:String(p?.css||'')});
          const actual=crypto.createHash('sha256').update(new TextEncoder().encode(payloadText(p.payload))).digest('hex');
          console.log('DECLARED='+p.payloadSha256);
          console.log('NODE_ACTUAL='+actual);
          if(p.payloadSha256!==actual){
            p.payloadSha256=actual;
            fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          }
          const raw=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const cpath='patches/catalog-v1.json', c=JSON.parse(fs.readFileSync(cpath,'utf8'));
          for(const x of c.patches||[]) if(x.id==='2.4.6.2') x.sha256=raw;
          const row=(c.patches||[]).find(x=>x.id==='2.4.6.2'); if(row) row.url='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/patches/TAREFAS-2.4.6.2-r2.tpatch'; c.cacheNonce='2462-r2-final';
          fs.writeFileSync(cpath,JSON.stringify(c,null,2)+'\n');
          console.log('RAW='+raw);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches/TAREFAS-2.4.6.2.tpatch patches/catalog-v1.json
          git commit -m "fix(patch): validar SHA 2.4.6.2 com Node"
          git push
