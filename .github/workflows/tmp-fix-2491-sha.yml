name: tmp-fix-2491-sha
on:
  push:
    branches: [app/releases]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/releases
      - name: Recalculate patch hashes
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='patches/TAREFAS-2.4.9.1.tpatch';
          const c='patches/catalog-v1.json';
          const patch=JSON.parse(fs.readFileSync(p,'utf8'));
          const payload=JSON.stringify({js:String(patch.payload?.js||''),css:String(patch.payload?.css||'')});
          patch.payloadSha256=crypto.createHash('sha256').update(Buffer.from(payload,'utf8')).digest('hex');
          fs.writeFileSync(p,JSON.stringify(patch,null,2)+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const cat=JSON.parse(fs.readFileSync(c,'utf8'));
          const e=cat.patches.find(x=>x.id==='2.4.9.1');
          e.sha256=sha;
          e.publishedAt=new Date().toISOString();
          fs.writeFileSync(c,JSON.stringify(cat,null,2)+'\n');
          console.log(JSON.stringify({payloadSha256:patch.payloadSha256,externalSha:sha}));
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/TAREFAS-2.4.9.1.tpatch patches/catalog-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(android): recalculate 2.4.9.1 patch hashes"
          git push origin app/releases
