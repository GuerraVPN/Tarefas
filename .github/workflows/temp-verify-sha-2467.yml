name: Verify TAREFAS 2.4.6.7 SHA
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: app/releases}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Verify
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='patches/TAREFAS-2.4.6.7.tpatch';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const payload=JSON.stringify({js:String(x.payload?.js||''),css:String(x.payload?.css||'')});
          const payloadSha=crypto.createHash('sha256').update(payload,'utf8').digest('hex');
          const rawSha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          console.log(JSON.stringify({payloadSha,rawSha,id:x.id,syntax:true},null,2));
          if(!/^[0-9a-f]{64}$/.test(payloadSha)) process.exit(1);
          NODE