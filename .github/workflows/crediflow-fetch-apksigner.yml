name: CrediFlow fetch apksigner

on:
  push:
    branches: [crediflow-beta195-build]
    paths:
      - '.github/workflows/crediflow-fetch-apksigner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Android Build Tools
        run: |
          curl -fL --retry 3 -o /tmp/build-tools.zip https://dl.google.com/android/repository/build-tools_r36.1_linux.zip
          echo 'a7b5889e4a79fcf3b0976bef40d401f4240fb1eed891d9d91169da1111e11d78  /tmp/build-tools.zip' | sha256sum -c -
          mkdir -p /tmp/build-tools
          unzip -q /tmp/build-tools.zip -d /tmp/build-tools
          APKSIGNER_JAR=$(find /tmp/build-tools -path '*/lib/apksigner.jar' -print -quit)
          ZIPALIGN=$(find /tmp/build-tools -type f -name zipalign -print -quit)
          test -n "$APKSIGNER_JAR"
          test -n "$ZIPALIGN"
          cp "$APKSIGNER_JAR" /tmp/apksigner.jar
          cp "$ZIPALIGN" /tmp/zipalign
          chmod +x /tmp/zipalign
          java -cp /tmp/apksigner.jar com.android.apksigner.ApkSignerTool --version > /tmp/version.txt
          /tmp/zipalign -h >/tmp/zipalign.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: crediflow-apksigner-tool
          path: |
            /tmp/apksigner.jar
            /tmp/zipalign
            /tmp/version.txt
            /tmp/zipalign.txt
          if-no-files-found: error
          retention-days: 1
