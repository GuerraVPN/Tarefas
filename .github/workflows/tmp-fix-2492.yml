name: tmp-fix-2492
on:
  push:
    branches: [app/releases]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/releases
      - name: Recalculate hashes and catalog
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='patches/TAREFAS-2.4.9.2.tpatch';
          const c='patches/catalog-v1.json';
          const patch=JSON.parse(fs.readFileSync(p,'utf8'));
          const payload=JSON.stringify({js:String(patch.payload?.js||''),css:String(patch.payload?.css||'')});
          patch.payloadSha256=crypto.createHash('sha256').update(Buffer.from(payload,'utf8')).digest('hex');
          fs.writeFileSync(p,JSON.stringify(patch,null,2)+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const cat=JSON.parse(fs.readFileSync(c,'utf8'));
          cat.latestPatch='2.4.9.2';
          const old=cat.patches.find(x=>x.id==='2.4.9.1'); if(old) old.installable=false;
          const entry=cat.patches.find(x=>x.id==='2.4.9.2')||{};
          Object.assign(entry,{id:'2.4.9.2',name:'TAREFAS 2.4.9.2 — Notas Fiscais no Orçamentários',baseVersion:'2.4.9',minBuild:293,maxBuild:293,channel:'alpha',publishedAt:new Date().toISOString(),cumulative:true,replacementMode:'replace-older-same-base',replaces:['2.4.9.1'],installable:true,description:'Preserva o Orçamentários da base anterior e adiciona somente o módulo Notas Fiscais.',url:'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/patches/TAREFAS-2.4.9.2.tpatch',sha256:sha,changelog:['Preserva a base existente do Orçamentários.','Adiciona somente Notas Fiscais.','Substitui o patch 2.4.9.1.']});
          if(!cat.patches.includes(entry)) cat.patches.push(entry);
          fs.writeFileSync(c,JSON.stringify(cat,null,2)+'\n');
          console.log(JSON.stringify({payloadSha256:patch.payloadSha256,externalSha:sha}));
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/TAREFAS-2.4.9.2.tpatch patches/catalog-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(android): finalize 2.4.9.2 hashes and catalog"
          git push origin app/releases
