name: CrediFlow Beta194 profile method

on:
  push:
    branches: [crediflow-beta194-build]
    paths:
      - '.github/workflows/crediflow-beta194-profile-method.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crediflow-beta194-build
      - name: Extract showProfile from committed smali
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('crediflow-inspect/MainActivityV06.smali').read_text()
          pos=src.find('.method showProfile()V')
          if pos < 0: raise SystemExit('showProfile not found')
          end=src.find('.end method',pos)+len('.end method')
          Path('crediflow-inspect/showProfile.smali').write_text(src[pos:end]+'\n')
          # extract relevant Ui public button methods
          ui=Path('crediflow-inspect/Ui.smali').read_text()
          blocks=[]
          for sig in ['.method primary(', '.method outline(', '.method root(', '.method title(', '.method body(']:
              p=ui.find(sig)
              if p>=0:
                  e=ui.find('.end method',p)+len('.end method')
                  blocks.append(ui[p:e])
          Path('crediflow-inspect/ui-button-methods.smali').write_text('\n\n'.join(blocks)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'CrediFlow Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add crediflow-inspect/showProfile.smali crediflow-inspect/ui-button-methods.smali
          git commit -m 'CrediFlow beta194: extract exact profile method' || exit 0
          git push origin HEAD:crediflow-beta194-build
