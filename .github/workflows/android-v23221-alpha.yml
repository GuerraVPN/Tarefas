name: Android 2.3.22.1 Alpha - Central 2.0

on:
  workflow_dispatch:
  push:
    branches: [app/android-v23221-prep]
    paths:
      - 'app/mobile-alpha-v23221-core.js'
      - 'app/mobile-alpha-v23221.js'
      - 'app/mobile-alpha-v23221-tabs.js'
      - 'app/release-v23221.txt'
      - 'scripts/build-mobile-v23221.mjs'
      - 'scripts/simulate-mobile-v23221.mjs'
      - 'scripts/verify-mobile-v23221.mjs'
      - '.github/workflows/android-v23221-alpha.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts jspdf@2.5.2

      - name: Simulacoes e testes preventivos
        run: |
          set -euo pipefail
          node --check app/mobile-alpha-v23221-core.js
          node --check app/mobile-alpha-v23221.js
          node --check app/mobile-alpha-v23221-tabs.js
          node --check scripts/build-mobile-v23221.mjs
          node --check scripts/simulate-mobile-v23221.mjs
          node --check scripts/verify-mobile-v23221.mjs
          node scripts/simulate-mobile-v23221.mjs app/mobile-alpha-v23221-core.js app/mobile-alpha-v23221.js

      - name: Gerar Alpha 2.3.22.1
        run: |
          set -euo pipefail
          node scripts/build-mobile-v23221.mjs
          node --check dist/mobile-alpha-v23221-core.js
          node --check dist/mobile-alpha-v23221.js
          node --check dist/mobile-alpha-v23221-tabs.js
          node --check dist/mobile-ai-v230.js
          node --check dist/native-mobile.js
          node --check dist/notificacoes.js
          node --check dist/central.js
          node --check dist/dashboard.js

      - name: Conferencia 1 de 3 - estrutura regressao e permissoes
        run: |
          set -euo pipefail
          node scripts/verify-mobile-v23221.mjs dist
          grep -q 'destructiveConfirmation:true' dist/mobile-ai-v230.js
          grep -q 'noPrivilegeElevation:true' dist/mobile-ai-v230.js
          grep -q 'credencial removida' dist/mobile-alpha-v23221-core.js
          grep -q '__TAREFAS_ALPHA_TABS_V264__' dist/mobile-alpha-v23221-tabs.js
          grep -q '__TAREFAS_DASHBOARD_NULL_GUARD_V264__' dist/dashboard.js
          ! grep -R -E 'sk-[A-Za-z0-9_-]{20,}|service_role|SUPABASE_SERVICE_ROLE_KEY' app/mobile-alpha-v23221*.js dist/mobile-alpha-v23221*.js

      - name: Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' -o app/google-services.json
          test -s app/google-services.json

      - name: Preparar Android SDK 36
        run: |
          set -euo pipefail
          npx cap add android
          cp app/google-services.json android/app/google-services.json
          sed -i 's/versionCode 1/versionCode 264/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.3.22.1"/' android/app/build.gradle
          npm run assets:android
          npx cap sync android
          JAVA_DIR='android/app/src/main/java/br/com/guerravpn/tarefas/mobile'
          mkdir -p "$JAVA_DIR"
          cp app/android/StorageAccessPlugin.java "$JAVA_DIR/StorageAccessPlugin.java"
          cp app/android/TarefasBiometricPlugin.java "$JAVA_DIR/TarefasBiometricPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.guerravpn.tarefas.mobile;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  registerPlugin(TarefasBiometricPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle')
          source = gradle.read_text(encoding='utf-8')
          dep = 'implementation "androidx.biometric:biometric:1.1.0"'
          if dep not in source:
              source = source.replace('dependencies {', f'dependencies {{\n    {dep}', 1)
          gradle.write_text(source, encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text(encoding='utf-8')
          permissions = [
              '<uses-permission android:name="android.permission.USE_BIOMETRIC" />',
              '<uses-permission android:name="android.permission.USE_FINGERPRINT" />',
              '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
          ]
          for permission in permissions:
              if permission not in source:
                  source = source.replace('<application', f'    {permission}\n    <application', 1)
          manifest.write_text(source, encoding='utf-8')
          PY
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle
          grep -q 'androidx.biometric:biometric:1.1.0' android/app/build.gradle
          grep -q 'registerPlugin(TarefasBiometricPlugin.class)' "$JAVA_DIR/MainActivity.java"
          ! grep -R -q 'MANAGE_EXTERNAL_STORAGE' android/app/src/main

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Conferencia 2 de 3 - APK e assets compilados
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          unzip -tq "$APK"
          python3 - <<'PY'
          import json
          with open('android/app/build/outputs/apk/release/output-metadata.json',encoding='utf-8') as f:
              element=json.load(f)['elements'][0]
          assert int(element['versionCode']) == 264, element
          assert str(element['versionName']) == '2.3.22.1', element
          PY
          unzip -p "$APK" assets/public/mobile-bootstrap.js | grep -q '__TAREFAS_ALPHA_23221__'
          unzip -p "$APK" assets/public/mobile-alpha-v23221-core.js | grep -q 'groupedNotifications'
          unzip -p "$APK" assets/public/mobile-alpha-v23221.js | grep -q 'TarefasAlpha23221'
          unzip -p "$APK" assets/public/mobile-alpha-v23221-tabs.js | grep -q '__TAREFAS_ALPHA_TABS_V264__'
          unzip -p "$APK" assets/public/mobile-alpha-v23221-tabs.js | grep -q 'data-tab="ferramentas"'
          unzip -p "$APK" assets/public/dashboard.js | grep -q '__TAREFAS_DASHBOARD_NULL_GUARD_V264__'
          unzip -p "$APK" assets/public/mobile-ai-v230.js | grep -q '__TAREFAS_AI_ALPHA_TOOLS_V264__'
          unzip -p "$APK" assets/public/native-mobile.js | grep -q '__TAREFAS_NATIVE_ALPHA_23221__'
          unzip -p "$APK" assets/public/native-mobile.js | grep -q '__TAREFAS_TASK_ATTACHMENTS_V261__'
          unzip -p "$APK" assets/public/mobile-biometric-v23211.js | grep -q '__TAREFAS_BIOMETRIC_V258__'
          unzip -p "$APK" classes.dex | strings | grep -q 'TarefasBiometricPlugin'
          echo 'CONFERENCIA 2/3 OK: APK build 264, versao 2.3.22.1, abas da Central e Dashboard protegido conferidos.'

      - name: Assinar APK GuerraVPN
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' -o "$RUNNER_TEMP/signing.json"
          jq -r '.keystore_b64' "$RUNNER_TEMP/signing.json" | base64 -d > "$RUNNER_TEMP/GuerraVPN.keystore"
          STORE_PASS="$(jq -r '.store_password' "$RUNNER_TEMP/signing.json")"
          KEY_ALIAS="$(jq -r '.key_alias' "$RUNNER_TEMP/signing.json")"
          KEY_PASS="$(jq -r '.key_password' "$RUNNER_TEMP/signing.json")"
          EXPECTED_CERT="$(jq -r '.cert_sha256' "$RUNNER_TEMP/signing.json")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/TAREFAS-2.3.22.1-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/GuerraVPN.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out TAREFAS-2.3.22.1.apk "$RUNNER_TEMP/TAREFAS-2.3.22.1-aligned.apk"
          echo "$EXPECTED_CERT" > "$RUNNER_TEMP/expected-cert.txt"

      - name: Conferencia 3 de 3 - assinatura SHA e integridade final
        run: |
          set -euo pipefail
          APK='TAREFAS-2.3.22.1.apk'
          test -s "$APK"
          unzip -tq "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(cat "$RUNNER_TEMP/expected-cert.txt" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          sha256sum "$APK" | tee TAREFAS-2.3.22.1.apk.sha256
          test "$(awk '{print length($1)}' TAREFAS-2.3.22.1.apk.sha256)" = '64'
          echo 'CONFERENCIA 3/3 OK: assinatura GuerraVPN, SHA-256 e integridade final validados.'

      - name: Gerar pacote ZIP completo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha-package/app" "$RUNNER_TEMP/alpha-package/scripts" "$RUNNER_TEMP/alpha-package/manifest"
          cp TAREFAS-2.3.22.1.apk TAREFAS-2.3.22.1.apk.sha256 "$RUNNER_TEMP/alpha-package/"
          cp app/release-v23221.txt app/mobile-alpha-v23221-core.js app/mobile-alpha-v23221.js app/mobile-alpha-v23221-tabs.js "$RUNNER_TEMP/alpha-package/app/"
          cp scripts/build-mobile-v23221.mjs scripts/simulate-mobile-v23221.mjs scripts/verify-mobile-v23221.mjs "$RUNNER_TEMP/alpha-package/scripts/"
          cp dist/ALPHA_2_3_22_1.json "$RUNNER_TEMP/alpha-package/manifest/"
          cat > "$RUNNER_TEMP/alpha-package/CONFERENCIAS.txt" <<'TXT'
          TAREFAS 2.3.22.1 Alpha build 264
          CONFERENCIA 1/3: estrutura, regressao, permissoes, abas e recursos OK
          CONFERENCIA 2/3: APK, versionCode/versionName, abas da Central e Dashboard protegido OK
          CONFERENCIA 3/3: assinatura GuerraVPN, SHA-256 e integridade final OK
          TXT
          (cd "$RUNNER_TEMP/alpha-package" && zip -qr "$GITHUB_WORKSPACE/TAREFAS-2.3.22.1-alpha-build-264.zip" .)
          unzip -tq TAREFAS-2.3.22.1-alpha-build-264.zip
          sha256sum TAREFAS-2.3.22.1-alpha-build-264.zip | tee TAREFAS-2.3.22.1-alpha-build-264.zip.sha256

      - name: Publicar APK e ZIP Alpha permanentes
        run: |
          set -euo pipefail
          git fetch origin app/releases
          RELEASES_DIR="$RUNNER_TEMP/tarefas-releases"
          git worktree add "$RELEASES_DIR" origin/app/releases
          mkdir -p "$RELEASES_DIR/downloads"
          cp TAREFAS-2.3.22.1.apk TAREFAS-2.3.22.1.apk.sha256 "$RELEASES_DIR/downloads/"
          cp TAREFAS-2.3.22.1-alpha-build-264.zip TAREFAS-2.3.22.1-alpha-build-264.zip.sha256 "$RELEASES_DIR/downloads/"
          cd "$RELEASES_DIR"
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add downloads/TAREFAS-2.3.22.1.apk downloads/TAREFAS-2.3.22.1.apk.sha256 downloads/TAREFAS-2.3.22.1-alpha-build-264.zip downloads/TAREFAS-2.3.22.1-alpha-build-264.zip.sha256
          if ! git diff --cached --quiet; then git commit -m 'release(android): TAREFAS 2.3.22.1 alpha build 264'; git push origin HEAD:app/releases; fi
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.22.1.apk'
          LOCAL_SHA="$(sha256sum "$GITHUB_WORKSPACE/TAREFAS-2.3.22.1.apk" | awk '{print $1}')"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error -L "$URL" -o "$RUNNER_TEMP/published.apk" && test "$(sha256sum "$RUNNER_TEMP/published.apk" | awk '{print $1}')" = "$LOCAL_SHA"; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Registrar Alpha 2.3.22.1
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-2.3.22.1.apk | awk '{print $1}')"
          jq -n --arg version '2.3.22.1' --argjson build 264 --arg channel 'alpha' --arg web_version '7.8.2' --arg title 'TAREFAS 2.3.22.1 Alpha — Central 2.0 em abas e ferramentas' --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.22.1.apk' --arg sha "$SHA" '{version:$version,build:$build,channel:$channel,web_version:$web_version,title:$title,changelog:["🔔 Central de Notificações 2.0 com seleção múltipla, exclusão em massa e gesto de deslizar.","🧭 Central reorganizada em abas: Notificações 2.0, Mensagens, Downloads, Favoritos e Ferramentas.","📥 Central de Downloads transformada em aba própria.","⭐ Favoritos transformados em aba própria.","🧰 Ferramentas reúne Salvar filtro atual, filtros salvos, Fila offline, sincronização e Central de Erros.","📱 Painel legado corrigido para respeitar cabeçalho, safe area e barra inferior.","🛡️ Dashboard protegido contra o erro Cannot set properties of null ao atualizar componentes removidos/indisponíveis.","📦 Atualizações do aplicativo agrupadas em um único item com quantidade de novas versões.","🔕 Filtros por categoria, silenciamento e retenção opcional de 30/60/90 dias, preservando itens fixados.","📡 Fila offline com retentativa e indicador de sincronização.","⚡ Ações rápidas, fixação, soneca e lembretes.","🧯 Central de Erros com sanitização de padrões de credencial.","🔢 Contadores separados por categoria.","🤖 IA com contexto e comandos das ferramentas da Alpha; ações destrutivas exigem confirmação.","🔐 Mantidas biometria, correções de arquivos/configurações e as permissões reais do perfil ativo, sem elevação de privilégios."],mandatory:false,download_url:$url,sha256:$sha}' > "$RUNNER_TEMP/release.json"
          CODE="$(curl --silent --show-error -o "$RUNNER_TEMP/result.json" -w '%{http_code}' -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish')"
          cat "$RUNNER_TEMP/result.json"
          test "$CODE" = '200'
          jq -e '.ok == true and .version == "2.3.22.1" and .build == 264 and .channel == "alpha"' "$RUNNER_TEMP/result.json" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.22.1-alpha-build-264
          path: |
            TAREFAS-2.3.22.1.apk
            TAREFAS-2.3.22.1.apk.sha256
            TAREFAS-2.3.22.1-alpha-build-264.zip
            TAREFAS-2.3.22.1-alpha-build-264.zip.sha256
            app/release-v23221.txt
            dist/ALPHA_2_3_22_1.json
          if-no-files-found: error
