name: Android 2.4.15.2 Beta — build 303
on:
  workflow_dispatch:
  push:
    branches: [app/android-v24152-beta-prep]
    paths:
      - 'app/native-mobile-entry.js'
      - 'app/release-v24152.txt'
      - 'scripts/build-mobile-v24152.mjs'
      - 'scripts/verify-mobile-v24152.mjs'
      - 'scripts/release-mobile-v24152.sh'
      - '.github/workflows/android-v24152-beta.yml'

concurrency:
  group: android-v24152-beta-build-303
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: app/android-v24152-beta-prep
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar, validar, assinar e publicar TAREFAS 2.4.15.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v24152.sh
          scripts/release-mobile-v24152.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.15.2-beta-build-303
          path: |
            TAREFAS-2.4.15.2-beta-build-303.apk
            TAREFAS-2.4.15.2-beta-build-303.apk.sha256
            TAREFAS-2.4.15.2-beta-build-303.zip
            TAREFAS-2.4.15.2-beta-build-303.zip.sha256
            app/release-v24152.txt
            dist/BETA_2_4_15_2.json
          if-no-files-found: error
