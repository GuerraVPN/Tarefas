name: Package Web 7.5.9

on:
  push:
    branches:
      - web/v759-prep
    paths:
      - .github/workflows/web-v759-prep.yml

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/v759-prep
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar 7.5.9
        run: |
          node --check pessoal_v7.js
          node --check v7_5_1_version.js
          grep -q "ESCALA_UI_VERSION='7.5.9'" pessoal_v7.js
          grep -q "VERSION='7.5.9'" v7_5_1_version.js
          grep -q 'serviceForecast' pessoal.html
          grep -q 'v7_5_9_transferir_meu_servico' pessoal_v7.js
      - name: Montar pacote estático
        run: |
          mkdir -p /tmp/tarefas-site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.png' -o -name '*.txt' \) -exec cp {} /tmp/tarefas-site/ \;
          cd /tmp/tarefas-site
          zip -q -r "$GITHUB_WORKSPACE/tarefas-web-7.5.9.zip" .
      - name: Upload pacote
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-web-7.5.9
          path: tarefas-web-7.5.9.zip
          if-no-files-found: error
