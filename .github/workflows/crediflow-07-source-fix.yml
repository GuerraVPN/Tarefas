name: CrediFlow 0.7 source fix

on:
  push:
    branches:
      - crediflow-0.7
    paths:
      - ".github/workflows/crediflow-07-source-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crediflow-0.7
      - name: Patch 0.7 welcome/version strings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crediflow-android/app/src/main/java/br/com/guerravpn/crediflow/MainActivityV06.kt')
          s = p.read_text()
          s = s.replace('Text("Versão 0.6 · build 6", color = PMuted, fontSize = 13.sp)', 'Text("Versão 0.7", color = PMuted, fontSize = 13.sp)')
          old = '''        if (hasAnalysis) {\n            TextButton(onClick = onAnalysis, modifier = Modifier.fillMaxWidth()) {\n                Text("Acompanhar minha análise")\n            }\n        }'''
          new = '''        TextButton(onClick = onAnalysis, modifier = Modifier.fillMaxWidth()) {\n            Text("Acompanhar solicitação")\n        }'''
          if old not in s:
              raise SystemExit('tracking block not found')
          s = s.replace(old, new)
          s = s.replace('A 0.6 monta a solicitação', 'A 0.7 monta a solicitação')
          s = s.replace('CrediFlow · 0.6 build 6 · Professional', 'CrediFlow · 0.7 · Professional')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crediflow-android/app/src/main/java/br/com/guerravpn/crediflow/MainActivityV06.kt
          git commit -m "CrediFlow 0.7: restore acompanhar solicitação" || exit 0
          git push origin HEAD:crediflow-0.7
