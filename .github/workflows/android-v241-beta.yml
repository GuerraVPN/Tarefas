name: Android 2.4.1 Beta - Launcher Icons

on:
  workflow_dispatch:
  push:
    branches: [app/android-v241-prep]
    paths:
      - '.v241-release-trigger'
      - 'app/android/TarefasLauncherIconPlugin.java'
      - 'app/mobile-launcher-icon-v241.js'
      - 'app/release-v241.txt'
      - 'scripts/build-mobile-v241.mjs'
      - 'scripts/verify-mobile-v241.mjs'
      - 'scripts/release-mobile-v241.sh'
      - '.github/workflows/android-v241-beta.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar, validar, assinar e publicar 2.4.1 Beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v241.sh
          scripts/release-mobile-v241.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.1-beta-build-276
          path: |
            TAREFAS-2.4.1.apk
            TAREFAS-2.4.1.apk.sha256
            TAREFAS-2.4.1-beta-build-276.zip
            TAREFAS-2.4.1-beta-build-276.zip.sha256
            app/release-v241.txt
            dist/BETA_2_4_1.json
          if-no-files-found: error
