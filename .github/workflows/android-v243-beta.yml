name: Android 2.4.3 Beta - Patch Consolidation

on:
  workflow_dispatch:
  push:
    branches: [app/android-v243-prep]
  pull_request:
    branches: [main]
    paths:
      - '.v243-release-trigger'
      - 'app/android/TarefasLauncherIconPlugin.java'
      - 'app/mobile-launcher-icon-v241.js'
      - 'app/release-v243.txt'
      - 'scripts/build-mobile-v243.mjs'
      - 'scripts/verify-mobile-v243.mjs'
      - 'scripts/release-mobile-v243.sh'
      - '.github/workflows/android-v243-beta.yml'

concurrency:
  group: android-v243-beta
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar, validar, assinar e publicar 2.4.3 Beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v243.sh
          scripts/release-mobile-v243.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.3-beta-build-278
          path: |
            TAREFAS-2.4.3.apk
            TAREFAS-2.4.3.apk.sha256
            TAREFAS-2.4.3-beta-build-278.zip
            TAREFAS-2.4.3-beta-build-278.zip.sha256
            app/release-v243.txt
            dist/BETA_2_4_3.json
          if-no-files-found: error
