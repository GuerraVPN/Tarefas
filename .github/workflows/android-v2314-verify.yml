name: Android 2.3.14 - Verificação antes da Beta

on:
  workflow_dispatch:
  push:
    branches: [app/android-v2314-prep]
    paths:
      - '.github/workflows/android-v2314-verify.yml'
      - 'scripts/build-mobile-v2314.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Instalar dependencias
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts jspdf@2.5.2

      - name: Gerar e testar bundle 2.3.14
        run: |
          set -euo pipefail
          node scripts/build-mobile-v2314.mjs
          grep -q "2.3.14" dist/mobile-bootstrap.js
          grep -q "const APP_BUILD = 244" dist/mobile-bootstrap.js
          grep -q '__TAREFAS_NO_ALL_FILES_ACCESS_V244__' dist/native-mobile.js
          grep -q '__ADITAMENTO_SITE_PDF_FLOW_V243__' dist/aditamento_v74.js
          grep -q 'doc.save(filename)' dist/aditamento_v74.js
          grep -q '__TAREFAS_BLOB_SAVE_PICKER_V243__' dist/mobile-blob-save-v243.js
          grep -q '__TAREFAS_ORC_LOADER_V243__' dist/orcamentarios-loader-v243.js
          grep -q '__TAREFAS_MATERIAL_CARGA_SERIAL_V243__' dist/v7_7_0_material_carga.js
          ! grep -q 'Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION' app/android/StorageAccessPlugin.java
          ! grep -q 'Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION' app/android/StorageAccessPlugin.java
          ! grep -q 'import android.provider.Settings' app/android/StorageAccessPlugin.java
          grep -q 'ret.put("opened", false)' app/android/StorageAccessPlugin.java
          grep -q 'ret.put("required", false)' app/android/StorageAccessPlugin.java
          grep -q 'async function requestAllFilesAccess(){return{opened:false,granted:true,required:false,deprecated:true}}' app/native-mobile-entry.js
          node scripts/test-aditamento-site-v2313.mjs dist/aditamento_v74.js
          node scripts/test-blob-save-v2313.mjs dist/mobile-blob-save-v243.js
          node scripts/test-orc-loader-v2313.mjs dist/orcamentarios-loader-v243.js
          node scripts/test-material-carga-v2313.mjs dist/v7_7_0_material_carga.js

      - name: Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' -o app/google-services.json
          test -s app/google-services.json

      - name: Preparar Android
        run: |
          set -euo pipefail
          npx cap add android
          cp app/google-services.json android/app/google-services.json
          sed -i 's/versionCode 1/versionCode 244/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.3.14"/' android/app/build.gradle
          npm run assets:android
          npx cap sync android
          JAVA_DIR='android/app/src/main/java/br/com/guerravpn/tarefas/mobile'
          mkdir -p "$JAVA_DIR"
          cp app/android/StorageAccessPlugin.java "$JAVA_DIR/StorageAccessPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.guerravpn.tarefas.mobile;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          ! grep -R 'MANAGE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          ! grep -R 'ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION\|ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION' "$JAVA_DIR"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK Release de verificação
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Inspecionar APK
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          unzip -tq "$APK"
          python3 - <<'PY'
          import json
          with open('android/app/build/outputs/apk/release/output-metadata.json',encoding='utf-8') as f: e=json.load(f)['elements'][0]
          assert int(e['versionCode'])==244,e
          assert str(e['versionName'])=='2.3.14',e
          PY
          unzip -p "$APK" assets/public/native-mobile.js | grep -q '__TAREFAS_NO_ALL_FILES_ACCESS_V244__'
          unzip -p "$APK" assets/public/aditamento_v74.js | grep -q 'doc.save(filename)'
          unzip -p "$APK" assets/public/mobile-blob-save-v243.js | grep -q '__TAREFAS_BLOB_SAVE_PICKER_V243__'

      - name: Salvar APK somente para verificação
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.14-verify-build-244
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
