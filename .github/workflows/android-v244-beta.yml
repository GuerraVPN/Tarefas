name: Android 2.4.4 Beta - Patch Consolidation

on:
  workflow_dispatch:
  push:
    branches: [app/android-v244-prep, app/releases]
  pull_request:
    branches: [main, app/releases]
    paths:
      - '.v244-release-trigger'
      - 'app/android/TarefasLauncherIconPlugin.java'
      - 'app/mobile-launcher-icon-v241.js'
      - 'app/release-v244.txt'
      - 'scripts/build-mobile-v244.mjs'
      - 'scripts/verify-mobile-v244.mjs'
      - 'scripts/release-mobile-v244.sh'
      - '.github/workflows/dispatch-android-v244-beta.yml'
      - '.github/workflows/android-v244-beta.yml'

concurrency:
  group: android-v244-beta-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'      - name: Diagnóstico SHA interno 2.4.5.1
        run: |
          node - <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const p=JSON.parse(fs.readFileSync('patches/TAREFAS-2.4.5.1.tpatch','utf8'));
          const t=JSON.stringify({js:String(p?.payload?.js||''),css:String(p?.payload?.css||'')});
          console.log('INTERNAL_PAYLOAD_SHA256='+crypto.createHash('sha256').update(t,'utf8').digest('hex'));
          console.log('DECLARED_PAYLOAD_SHA256='+p.payloadSha256);
          NODE
      - name: Compilar, validar, assinar e publicar 2.4.4 Beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-mobile-v244.sh
          scripts/release-mobile-v244.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.4.4-beta-build-279
          path: |
            TAREFAS-2.4.4.apk
            TAREFAS-2.4.4.apk.sha256
            TAREFAS-2.4.4-beta-build-279.zip
            TAREFAS-2.4.4-beta-build-279.zip.sha256
            app/release-v244.txt
            dist/BETA_2_4_4.json
          if-no-files-found: error
