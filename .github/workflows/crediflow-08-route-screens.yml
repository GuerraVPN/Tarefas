name: CrediFlow 0.8 route screens

on:
  push:
    branches:
      - crediflow-0.8
    paths:
      - ".github/workflows/crediflow-08-route-screens.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crediflow-0.8
      - name: Route 0.8 screens
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crediflow-android/app/src/main/java/br/com/guerravpn/crediflow/MainActivityV06.kt')
          s = p.read_text()
          replacements = {
            'V06Screen.WELCOME -> V06Welcome(': 'V06Screen.WELCOME -> V08Welcome(',
            'V06Screen.ANALYSIS -> V06Analysis(': 'V06Screen.ANALYSIS -> V08Analysis(',
            'V06Screen.LOAN -> V06Loan(session) { screen = V06Screen.HOME }': 'V06Screen.LOAN -> V08Loan(session) { screen = V06Screen.HOME }',
            'V06Screen.ADMIN -> V06Admin(': 'V06Screen.ADMIN -> V08Admin(',
            'V06Screen.ADMIN_DETAIL -> V06AdminDetail(': 'V06Screen.ADMIN_DETAIL -> V08AdminDetail(',
            'CrediFlow · 0.7 · Professional': 'CrediFlow · 0.8 · Professional',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing: {old}')
              s=s.replace(old,new,1 if old.startswith('V06Screen.') else -1)
          p.write_text(s)
          PY
      - name: Commit routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crediflow-android/app/src/main/java/br/com/guerravpn/crediflow/MainActivityV06.kt
          git commit -m "CrediFlow 0.8: enable new loan and admin screens" || exit 0
          git push origin HEAD:crediflow-0.8
