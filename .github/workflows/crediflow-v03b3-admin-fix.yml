name: CrediFlow v0.3 build 3 admin fixes

on:
  push:
    branches:
      - crediflow-v0.3-build3
    paths:
      - "crediflow-android/patch_v03b3_admin_fix.py"
      - ".github/workflows/crediflow-v03b3-admin-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: crediflow-v0.3-build3
      - name: Apply admin activation fixes
        run: python3 crediflow-android/patch_v03b3_admin_fix.py
      - name: Commit patched source
        run: |
          git config user.name "CrediFlow CI"
          git config user.email "actions@users.noreply.github.com"
          git add crediflow-android/app/src/main/java/br/com/guerravpn/crediflow/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "CrediFlow 0.3 build 3: fix admin values, activation code and email"
          git push origin HEAD:crediflow-v0.3-build3
