name: Web 7.7.0 About Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/v770_about_fix.py'
      - '.github/workflows/web-v770-about-fix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar correção do About
        run: python3 .github/v770_about_fix.py
      - name: Validar JavaScript e HTML
        run: |
          set -euo pipefail
          node --check v4_ui.js
          node --check v6_5_patch.js
          node --check v6_2_mobile.js
          grep -q "navItem('about','About','about.html','file')" v4_ui.js
          grep -q "v7_5_1_about.js?v=7.7.0-aboutfix" about.html
          grep -q "v6_5_patch.js?v=7.7.0-aboutfix" v6_2_mobile.js
      - name: Salvar correção validada
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'GuerraVPN Web Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add about.html v4_ui.js v6_5_patch.js v6_2_mobile.js
          git commit -m 'fix(web): corrigir carregamento do About na 7.7.0'
          git push origin HEAD:main
