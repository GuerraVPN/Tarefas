name: Package Web 7.5.8

on:
  push:
    branches: [web/v758-deploy]
    paths:
      - '.github/workflows/web-v758-vercel-deploy.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar pacote estático
        run: |
          mkdir -p /tmp/tarefas-site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.png' -o -name '*.txt' \) -exec cp {} /tmp/tarefas-site/ \;
          test -s /tmp/tarefas-site/index.html
          test -s /tmp/tarefas-site/v7_5_8_patch.js
          grep -q "VERSION='7.5.8'" /tmp/tarefas-site/v7_5_1_version.js
          cd /tmp/tarefas-site
          zip -q -r "$GITHUB_WORKSPACE/tarefas-web-7.5.8.zip" .
      - name: Upload pacote
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-web-7.5.8
          path: tarefas-web-7.5.8.zip
          if-no-files-found: error
