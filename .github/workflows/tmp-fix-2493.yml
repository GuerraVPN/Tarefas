name: Finalizar Alpha 2.4.9.3
on:
  push:
    branches: [app/releases]
    paths:
      - 'patches/TAREFAS-2.4.9.3.tpatch'
      - 'patches/catalog-v1.json'
      - '.github/workflows/tmp-fix-2493.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/releases
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corrigir SHA e catálogo
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const patchPath='patches/TAREFAS-2.4.9.3.tpatch';
          const p=JSON.parse(fs.readFileSync(patchPath,'utf8'));
          const payload=JSON.stringify({js:String(p.payload?.js||''),css:String(p.payload?.css||'')});
          p.payloadSha256=crypto.createHash('sha256').update(Buffer.from(payload,'utf8')).digest('hex');
          fs.writeFileSync(patchPath,JSON.stringify(p,null,2)+'\n');
          const patchSha=crypto.createHash('sha256').update(fs.readFileSync(patchPath)).digest('hex');
          const catPath='patches/catalog-v1.json';
          const cat=JSON.parse(fs.readFileSync(catPath,'utf8'));
          cat.latestPatch='2.4.9.3';
          for(const x of cat.patches||[]) if(['2.4.9.1','2.4.9.2'].includes(x.id)) x.installable=false;
          cat.patches=(cat.patches||[]).filter(x=>x.id!=='2.4.9.3');
          cat.patches.push({
            id:'2.4.9.3',
            name:p.name,
            baseVersion:'2.4.9',
            minBuild:293,
            maxBuild:293,
            channel:'alpha',
            publishedAt:new Date().toISOString(),
            cumulative:true,
            replacementMode:'replace-older-same-base',
            replaces:['2.4.9.2','2.4.9.1'],
            installable:true,
            description:p.description,
            url:'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/patches/TAREFAS-2.4.9.3.tpatch',
            sha256:patchSha,
            changelog:p.changelog
          });
          fs.writeFileSync(catPath,JSON.stringify(cat,null,2)+'\n');
          console.log('PAYLOAD_SHA='+p.payloadSha256);
          console.log('PATCH_SHA='+patchSha);
          NODE
      - name: Commit final
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches/TAREFAS-2.4.9.3.tpatch patches/catalog-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalizar Alpha 2.4.9.3'
          git push origin app/releases
