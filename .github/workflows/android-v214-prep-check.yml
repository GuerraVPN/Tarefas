name: Android 2.1.4 Prep Check

on:
  push:
    branches: [app/android-v214-prep]
    paths:
      - 'scripts/build-mobile-v214.mjs'
      - 'scripts/verify-mobile-v214.mjs'
      - '.github/workflows/android-v214-prep-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/android-v214-prep
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar Base Web 7.6.3
        run: |
          set -euo pipefail
          git fetch origin main
          for f in pessoal_v7.js pessoal.html ferias_dispensas.html v7_5_1_version.js v7_5_1_about.js v6_2_mobile.js games.html games.js orcamentarios.html lavanderia_documento_v762.js; do
            git show "origin/main:$f" > "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('package.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['version']='2.1.4'
          d['description']='TAREFAS Android 2.1.4 build 214 beta com Base Web 7.6.3, férias protegidas até ADP e ODT da Lavagem.'
          d['scripts']['build:web']='node scripts/build-mobile-v214.mjs'
          d['scripts']['verify:web']='node scripts/verify-mobile-v214.mjs dist'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('package-lock.json'); s=p.read_text(encoding='utf-8')
          s=s.replace('"version": "2.1.2"','"version": "2.1.4"',2)
          s=s.replace('"version": "2.1.3"','"version": "2.1.4"',2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Instalar dependências
        run: npm ci
      - name: Gerar bundle
        run: npm run build:web
      - name: Validar bundle
        run: |
          npm run verify:web
          node --check dist/pessoal_v7.js
          node --check dist/lavanderia_documento_v762.js
          grep -q '2.1.4 • WEB 7.6.3' dist/mobile-v12.js
          grep -q "ESCALA_UI_VERSION='7.6.3'" dist/pessoal_v7.js
          grep -q 'function vacationProtectionFor' dist/pessoal_v7.js
          grep -q 'application/vnd.oasis.opendocument.text' dist/lavanderia_documento_v762.js
      - name: Salvar fonte validada
        run: |
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add pessoal_v7.js pessoal.html ferias_dispensas.html v7_5_1_version.js v7_5_1_about.js v6_2_mobile.js games.html games.js orcamentarios.html lavanderia_documento_v762.js package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): incorporar Web 7.6.3 na 2.1.4'
            git push origin HEAD:app/android-v214-prep
          fi
