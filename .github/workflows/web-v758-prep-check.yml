name: Web 7.5.8 Prep Check

on:
  push:
    branches: [web/v758-prep]
    paths:
      - 'index.html'
      - 'v7_5_1_version.js'
      - 'v7_5_1_about.js'
      - 'v7_5_8_patch.js'
      - '.github/workflows/web-v758-prep-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir sintaxe JS
        run: |
          node --check v7_5_8_patch.js
          node --check v7_5_1_version.js
          node --check v7_5_1_about.js
      - name: Conferir recursos da 7.5.8
        run: |
          grep -q "VERSION='7.5.8'" v7_5_1_version.js
          grep -q "v7_5_8_patch.js" v7_5_1_version.js
          grep -q "__TAREFAS_NATIVE_APP__" v7_5_8_patch.js
          grep -q "Alterar tarefa" v7_5_8_patch.js
          grep -q "v1_9_6_message_block_status" v7_5_8_patch.js
          grep -q "v1_9_6_set_message_block" v7_5_8_patch.js
          grep -q "v1_9_6_send_message" v7_5_8_patch.js
          grep -q "Este usuário bloqueou suas mensagens" v7_5_8_patch.js
          grep -q "v1_7_emitir_sessao_push" index.html
          grep -q "tarefasPushSession17" index.html
          grep -q "const VERSION='7.5.8'" v7_5_1_about.js
