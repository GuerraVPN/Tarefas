name: Android 2.3.12 Beta - Verificada

on:
  workflow_dispatch:
  push:
    branches: [app/android-v2312-prep]
    paths:
      - '.github/workflows/android-v2312-beta.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout 2.3.12 aprovada
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Instalar dependencias
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts jspdf@2.5.2

      - name: Repetir testes obrigatorios antes da publicacao
        run: |
          set -euo pipefail
          node scripts/build-mobile-v2312.mjs
          node scripts/verify-mobile-v2312.mjs dist
          node scripts/test-aditamento-v2312.mjs dist/aditamento_v74.js
          node scripts/test-aditamento-ui-v2312.mjs dist/aditamento_v74.js
          node scripts/test-material-carga-v2312.mjs dist/v7_7_0_material_carga.js
          grep -q "2.3.12" dist/mobile-bootstrap.js
          grep -q "const APP_BUILD = 242" dist/mobile-bootstrap.js
          test -s dist/jspdf.umd.min.js
          grep -q "__ADITAMENTO_NATIVE_SAVE_V242__" dist/aditamento_v74.js
          ! grep -q "doc.save(filename)" dist/aditamento_v74.js
          ! grep -q "cdn.jsdelivr.net/npm/jspdf" dist/pessoal.html
          grep -q "__TAREFAS_ORC_LOADER_V242__" dist/orcamentarios-loader-v242.js
          grep -q "__TAREFAS_MATERIAL_CARGA_EVENT_DRIVEN_V242__" dist/v7_7_0_material_carga.js
          ! grep -Eq "MutationObserver|setInterval\(" dist/v7_7_0_material_carga.js
          ! grep -q "limit(10000)" dist/pedidos_v6.js
          ! grep -q "limit(10000)" dist/movimentacoes_v6.js
          test ! -e dist/v7_7_2_scale_export.js
          ! grep -q "GEMINI_API_KEY\|OPENAI_API_KEY\|SUPABASE_SERVICE_ROLE_KEY\|sk-proj-" dist/*.js

      - name: Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json

      - name: Preparar Android
        run: |
          set -euo pipefail
          npx cap add android
          cp app/google-services.json android/app/google-services.json
          sed -i 's/versionCode 1/versionCode 242/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.3.12"/' android/app/build.gradle
          npm run assets:android
          npx cap sync android
          JAVA_DIR='android/app/src/main/java/br/com/guerravpn/tarefas/mobile'
          mkdir -p "$JAVA_DIR"
          cp app/android/StorageAccessPlugin.java "$JAVA_DIR/StorageAccessPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.guerravpn.tarefas.mobile;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Inspecionar APK antes de assinar
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          unzip -tq "$APK"
          python3 - <<'PY'
          import json
          with open('android/app/build/outputs/apk/release/output-metadata.json',encoding='utf-8') as f: e=json.load(f)['elements'][0]
          assert int(e['versionCode'])==242,e
          assert str(e['versionName'])=='2.3.12',e
          PY
          unzip -p "$APK" assets/public/aditamento_v74.js | grep -q '__ADITAMENTO_NATIVE_SAVE_V242__'
          unzip -p "$APK" assets/public/aditamento_v74.js | grep -q 'ADITAMENTO AO BOLETIM INTERNO'
          unzip -l "$APK" | grep -q 'assets/public/jspdf.umd.min.js'
          unzip -p "$APK" assets/public/orcamentarios-loader-v242.js | grep -q '__TAREFAS_ORC_LOADER_V242__'
          unzip -p "$APK" assets/public/v7_7_0_material_carga.js | grep -q '__TAREFAS_MATERIAL_CARGA_EVENT_DRIVEN_V242__'
          if unzip -p "$APK" assets/public/v7_7_0_material_carga.js | grep -Eq 'MutationObserver|setInterval\('; then echo 'ERRO: loop automatico ainda presente'; exit 1; fi
          if unzip -l "$APK" | grep -q 'assets/public/v7_7_2_scale_export.js'; then echo 'ERRO: exportador de escala ainda empacotado'; exit 1; fi

      - name: Assinar APK GuerraVPN
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' -o "$RUNNER_TEMP/signing.json"
          jq -r '.keystore_b64' "$RUNNER_TEMP/signing.json" | base64 -d > "$RUNNER_TEMP/GuerraVPN.keystore"
          STORE_PASS="$(jq -r '.store_password' "$RUNNER_TEMP/signing.json")"
          KEY_ALIAS="$(jq -r '.key_alias' "$RUNNER_TEMP/signing.json")"
          KEY_PASS="$(jq -r '.key_password' "$RUNNER_TEMP/signing.json")"
          EXPECTED_CERT="$(jq -r '.cert_sha256' "$RUNNER_TEMP/signing.json")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/TAREFAS-2.3.12-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/GuerraVPN.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out TAREFAS-2.3.12.apk "$RUNNER_TEMP/TAREFAS-2.3.12-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs TAREFAS-2.3.12.apk
          ACTUAL_CERT="$($APKSIGNER verify --verbose --print-certs TAREFAS-2.3.12.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

      - name: Publicar APK beta permanente
        run: |
          set -euo pipefail
          git fetch origin app/releases
          RELEASES_DIR="$RUNNER_TEMP/tarefas-releases"
          git worktree add "$RELEASES_DIR" origin/app/releases
          mkdir -p "$RELEASES_DIR/downloads"
          cp TAREFAS-2.3.12.apk "$RELEASES_DIR/downloads/TAREFAS-2.3.12.apk"
          cd "$RELEASES_DIR"
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add -A downloads/
          if ! git diff --cached --quiet; then git commit -m 'release(android): TAREFAS 2.3.12 beta build 242'; git push origin HEAD:app/releases; fi
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.12.apk'
          LOCAL_SHA="$(sha256sum "$GITHUB_WORKSPACE/TAREFAS-2.3.12.apk" | awk '{print $1}')"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error -L "$URL" -o "$RUNNER_TEMP/published.apk"; then
              test "$(sha256sum "$RUNNER_TEMP/published.apk" | awk '{print $1}')" = "$LOCAL_SHA" && exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Registrar beta 2.3.12
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-2.3.12.apk | awk '{print $1}')"
          jq -n --arg version '2.3.12' --argjson build 242 --arg channel 'beta' --arg web_version '7.8.2' --arg title 'TAREFAS 2.3.12 Beta — Aditamento e Material Carga' --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.12.apk' --arg sha "$SHA" '{version:$version,build:$build,channel:$channel,web_version:$web_version,title:$title,changelog:["📄 Gerar aditamento corrigido com execução e salvamento nativo para PDF e ODT.","🧪 PDF e ODT testados em runtime e também pelo clique real do botão antes da publicação.","📦 jsPDF agora vai embarcado no APK e não depende de CDN no WebView Android.","⚡ Material Carga/Depósitos sem MutationObserver recursivo e sem polling automático.","🔎 Consultas do Material Carga filtradas pelo tipo ativo e pendências reais.","🧩 Orçamentários continua com carregamento isolado por módulo e sem consultas iniciais de 10 mil itens.","🛑 Exportador antigo Gerar Escala permanece fora do APK."],mandatory:false,download_url:$url,sha256:$sha}' > "$RUNNER_TEMP/release.json"
          CODE="$(curl --silent --show-error -o "$RUNNER_TEMP/result.json" -w '%{http_code}' -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish')"
          cat "$RUNNER_TEMP/result.json"
          test "$CODE" = '200'
          jq -e '.ok == true and .version == "2.3.12" and .build == 242 and .channel == "beta"' "$RUNNER_TEMP/result.json" >/dev/null

      - name: Salvar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.12-beta-build-242
          path: TAREFAS-2.3.12.apk
          if-no-files-found: error
