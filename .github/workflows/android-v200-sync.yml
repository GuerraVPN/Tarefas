name: Android 2.0.0 Sync Web 7.6.0
on:
  push:
    branches: [app/android-v200-prep]
    paths: ['.github/workflows/android-v200-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app/android-v200-prep
          fetch-depth: 0
      - name: Copiar Base Web 7.6.0 do main
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/tarefas-web-main
          git worktree add /tmp/tarefas-web-main origin/main
          for f in /tmp/tarefas-web-main/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.html|*.js|*.css|*.png|*.jpg|*.jpeg|*.webp|*.svg|*.ico|*.json|*.webmanifest|*.txt) cp "$f" . ;;
            esac
          done
          grep -q "VERSION='7.6.0'" v7_5_1_version.js
          test -s v7_6_0_patch.js
          test -s games.html
          test -s games.js
      - name: Commitar Base Web 7.6.0
        run: |
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add -- '*.html' '*.js' '*.css' '*.png' '*.jpg' '*.jpeg' '*.webp' '*.svg' '*.ico' '*.json' '*.webmanifest' '*.txt' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'feat(android): atualizar Base Web para 7.6.0'
            git push origin HEAD:app/android-v200-prep
          fi
