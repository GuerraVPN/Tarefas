name: Android 2.3.11 Beta - Aditamento e Orcamentarios

on:
  workflow_dispatch:
  push:
    branches: [app/android-v2311-prep]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'sistema_comum.js'
      - 'orcamentarios_relatorio_light.js'
      - 'v7_5_1_version.js'
      - 'aditamento_v74.js'
      - 'orcamentarios.html'
      - 'pedidos_v6.js'
      - 'movimentacoes_v6.js'
      - 'guias_v6.js'
      - 'passagem_carga_v6.js'
      - 'material_carga_v6.js'
      - 'v7_7_0_material_carga.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-v2311-beta.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout 2.3.11 Beta
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar e validar bundle 2.3.11
        run: |
          set -euo pipefail
          node scripts/build-mobile-v2311.mjs
          node scripts/verify-mobile-v2311.mjs dist
          grep -q "2.3.11" dist/mobile-bootstrap.js
          grep -q "const APP_BUILD = 241" dist/mobile-bootstrap.js
          grep -q "ADITAMENTO AO BOLETIM INTERNO" dist/aditamento_v74.js
          grep -q "ADITAMENTO_ODT" dist/aditamento_v74.js
          grep -q "Gerar ODT" dist/aditamento_v74.js
          ! grep -q "ESCALA DE SERVIÇO" dist/aditamento_v74.js
          grep -q "__BLOCK_V772_SCALE_CACHE__" dist/pessoal.html
          test ! -e dist/v7_7_2_scale_export.js
          ! grep -q "v7_7_2_scale_export.js" dist/v7_5_1_version.js
          grep -q "__TAREFAS_ORC_LOADER_V241__" dist/orcamentarios-loader-v241.js
          grep -q "orcamentarios-loader-v241.js?v=2.3.11-b241" dist/orcamentarios.html
          ! grep -q "limit(10000)" dist/pedidos_v6.js
          ! grep -q "limit(10000)" dist/movimentacoes_v6.js
          ! grep -q "observe(document.body" dist/v7_7_0_material_carga.js
          ! grep -q "GEMINI_API_KEY\|OPENAI_API_KEY\|SUPABASE_SERVICE_ROLE_KEY\|sk-proj-" dist/*.js

      - name: Firebase Android
        run: |
          curl --fail --silent --show-error --retry 3 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/firebase-config-v17' -o app/google-services.json
          test -s app/google-services.json
          grep -q 'br.com.guerravpn.tarefas.mobile' app/google-services.json

      - name: Preparar Android
        run: |
          npx cap add android
          cp app/google-services.json android/app/google-services.json
          sed -i 's/versionCode 1/versionCode 241/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.3.11"/' android/app/build.gradle
          npm run assets:android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions='''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'''
          if 'android.permission.READ_EXTERNAL_STORAGE' not in s:s=s.replace('<application',permissions+'    <application',1)
          if 'android:requestLegacyExternalStorage' not in s:s=s.replace('<application','<application android:requestLegacyExternalStorage="true"',1)
          p.write_text(s,encoding='utf-8')
          xml=Path('android/app/src/main/res/xml');xml.mkdir(parents=True,exist_ok=True)
          (xml/'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n  <files-path name="files" path="." />\n  <cache-path name="cache" path="." />\n  <external-files-path name="external-files" path="." />\n  <external-cache-path name="external-cache" path="." />\n  <external-path name="external" path="." />\n</paths>\n''',encoding='utf-8')
          PY
          JAVA_DIR='android/app/src/main/java/br/com/guerravpn/tarefas/mobile'
          mkdir -p "$JAVA_DIR"
          cp app/android/StorageAccessPlugin.java "$JAVA_DIR/StorageAccessPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.guerravpn.tarefas.mobile;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Validar APK 2.3.11
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          unzip -tq "$APK"
          python3 - <<'PY'
          import json
          with open('android/app/build/outputs/apk/release/output-metadata.json',encoding='utf-8') as f: el=json.load(f)['elements'][0]
          assert int(el['versionCode'])==241,el
          assert str(el['versionName'])=='2.3.11',el
          PY
          unzip -p "$APK" assets/public/aditamento_v74.js | grep -q 'ADITAMENTO AO BOLETIM INTERNO'
          unzip -p "$APK" assets/public/aditamento_v74.js | grep -q 'ADITAMENTO_ODT'
          if unzip -p "$APK" assets/public/aditamento_v74.js | grep -q 'ESCALA DE SERVIÇO'; then echo 'ERRO: aditamento contém gerador de escala'; exit 1; fi
          unzip -p "$APK" assets/public/pessoal.html | grep -q '__BLOCK_V772_SCALE_CACHE__'
          unzip -p "$APK" assets/public/orcamentarios-loader-v241.js | grep -q '__TAREFAS_ORC_LOADER_V241__'
          unzip -p "$APK" assets/public/orcamentarios.html | grep -q 'orcamentarios-loader-v241.js?v=2.3.11-b241'
          if unzip -p "$APK" assets/public/orcamentarios.html | grep -E '<script[^>]+src="(guias_v6|pedidos_v6|movimentacoes_v6|material_carga_v6|v7_7_0_material_carga|passagem_carga_v6)\.js'; then echo 'ERRO: módulo pesado ainda estático no Orçamentários'; exit 1; fi
          if unzip -p "$APK" assets/public/pedidos_v6.js | grep -q 'limit(10000)'; then echo 'ERRO: pedidos ainda busca 10 mil itens'; exit 1; fi
          if unzip -p "$APK" assets/public/movimentacoes_v6.js | grep -q 'limit(10000)'; then echo 'ERRO: movimentações ainda busca 10 mil itens'; exit 1; fi
          if unzip -p "$APK" assets/public/v7_7_0_material_carga.js | grep -q 'observe(document.body'; then echo 'ERRO: Material Carga observa body inteiro'; exit 1; fi
          if unzip -l "$APK" | grep -q 'assets/public/v7_7_2_scale_export.js'; then echo 'ERRO: Gerar escala ainda empacotado'; exit 1; fi
          if unzip -p "$APK" assets/public/v7_5_1_version.js | grep -q 'v7_7_2_scale_export.js'; then echo 'ERRO: Gerar escala ainda carregado'; exit 1; fi

      - name: Assinar APK GuerraVPN
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-signing" | jq -r '.value')"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-signing-material' -o "$RUNNER_TEMP/signing.json"
          jq -r '.keystore_b64' "$RUNNER_TEMP/signing.json" | base64 -d > "$RUNNER_TEMP/GuerraVPN.keystore"
          STORE_PASS="$(jq -r '.store_password' "$RUNNER_TEMP/signing.json")"
          KEY_ALIAS="$(jq -r '.key_alias' "$RUNNER_TEMP/signing.json")"
          KEY_PASS="$(jq -r '.key_password' "$RUNNER_TEMP/signing.json")"
          EXPECTED_CERT="$(jq -r '.cert_sha256' "$RUNNER_TEMP/signing.json")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/TAREFAS-2.3.11-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/GuerraVPN.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out TAREFAS-2.3.11.apk "$RUNNER_TEMP/TAREFAS-2.3.11-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs TAREFAS-2.3.11.apk
          ACTUAL_CERT="$($APKSIGNER verify --verbose --print-certs TAREFAS-2.3.11.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

      - name: Publicar APK beta permanente
        run: |
          set -euo pipefail
          git fetch origin app/releases
          RELEASES_DIR="$RUNNER_TEMP/tarefas-releases"
          git worktree add "$RELEASES_DIR" origin/app/releases
          mkdir -p "$RELEASES_DIR/downloads"
          cp TAREFAS-2.3.11.apk "$RELEASES_DIR/downloads/TAREFAS-2.3.11.apk"
          cd "$RELEASES_DIR"
          git config user.name 'GuerraVPN Android Build'
          git config user.email '81371258+GuerraVPN@users.noreply.github.com'
          git add -A downloads/
          if ! git diff --cached --quiet; then git commit -m 'release(android): TAREFAS 2.3.11 beta build 241'; git push origin HEAD:app/releases; fi
          URL='https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.11.apk'
          LOCAL_SHA="$(sha256sum "$GITHUB_WORKSPACE/TAREFAS-2.3.11.apk" | awk '{print $1}')"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error -L "$URL" -o "$RUNNER_TEMP/published.apk"; then
              test "$(sha256sum "$RUNNER_TEMP/published.apk" | awk '{print $1}')" = "$LOCAL_SHA" && exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Registrar beta 2.3.11
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tarefas-android-release" | jq -r '.value')"
          SHA="$(sha256sum TAREFAS-2.3.11.apk | awk '{print $1}')"
          jq -n --arg version '2.3.11' --argjson build 241 --arg channel 'beta' --arg web_version '7.8.2' --arg title 'TAREFAS 2.3.11 Beta — Aditamento e Orçamentários' --arg url 'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.3.11.apk' --arg sha "$SHA" '{version:$version,build:$build,channel:$channel,web_version:$web_version,title:$title,changelog:["📄 Gerar aditamento restaurado como documento oficial do Aditamento ao Boletim, sem confundir com exportação de escala.","📝 Aditamento disponível em PDF ou ODT editável usando o mesmo conteúdo oficial.","🛑 Exportador antigo de Escala bloqueado inclusive contra cache antigo do WebView.","⚡ Orçamentários passa a carregar fisicamente apenas o JavaScript do módulo aberto.","📦 Desrelacionamento/Distribuição não carrega mais 10 mil itens na abertura; materiais são consultados ao abrir o pedido.","🔄 Movimentações não carrega mais 10 mil itens na abertura; materiais são consultados ao abrir a movimentação.","🗂️ Material Carga observa apenas seu próprio módulo e atualiza em segundo plano com intervalo reduzido.","📑 Guias e Passagens tiveram volume inicial limitado para reduzir uso de memória no Android."],mandatory:false,download_url:$url,sha256:$sha}' > "$RUNNER_TEMP/release.json"
          CODE="$(curl --silent --show-error -o "$RUNNER_TEMP/result.json" -w '%{http_code}' -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" 'https://bpvijatnsluwsgnzklrd.supabase.co/functions/v1/android-release-publish')"
          cat "$RUNNER_TEMP/result.json"
          test "$CODE" = '200'
          jq -e '.ok == true and .version == "2.3.11" and .build == 241 and .channel == "beta"' "$RUNNER_TEMP/result.json" >/dev/null

      - name: Salvar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.11-beta-build-241
          path: TAREFAS-2.3.11.apk
          if-no-files-found: error
