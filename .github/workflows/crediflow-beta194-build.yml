          # Add activity to manifest.
          mf=root/'AndroidManifest.xml'
          m=mf.read_text()
          activity='        <activity android:exported="false" android:name="br.com.guerravpn.crediflow.UpdateActivity" android:screenOrientation="portrait"/>\n'
          if 'br.com.guerravpn.crediflow.UpdateActivity' not in m:
              m=m.replace('    </application>',activity+'    </application>')
          mf.write_text(m)

          # Versioning in apktool metadata.
          y=root/'apktool.yml'; t=y.read_text()
          t=re.sub(r'versionCode: .*', 'versionCode: 194', t)
          t=re.sub(r'versionName: .*', 'versionName: 1.9.4', t)
          y.write_text(t)
          PY
      - name: Rebuild Beta 194
        run: |
          java -jar /tmp/apktool.jar b /tmp/app -o /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk
          unzip -t /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk
          mkdir -p /tmp/qa
          unzip -p /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk classes3.dex > /tmp/qa/classes3.dex
          sha256sum /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk /tmp/qa/classes3.dex > /tmp/qa/hashes.txt
          grep -q 'versionCode: 194' /tmp/app/apktool.yml
          grep -q 'versionName: 1.9.4' /tmp/app/apktool.yml
          grep -q 'UpdateActivity' /tmp/app/AndroidManifest.xml
          grep -q 'Atualiza\\u00e7\\u00f5es' $(find /tmp/app -name MainActivityV06.smali)
          printf 'OK clean_apktool_rebuild\nOK version_194\nOK update_activity_declared\nOK native_profile_button\nOK classes3_reassembled\n' > /tmp/qa/QA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrediFlow-v1.9.4-beta-build194-unsigned
          path: |
            /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk
            /tmp/qa/QA.txt
            /tmp/qa/hashes.txt
          if-no-files-found: error
          retention-days: 7
