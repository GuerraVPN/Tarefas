name: CrediFlow Beta194 clean build

on:
  push:
    branches: [crediflow-beta194-build]
    paths:
      - '.github/workflows/crediflow-beta194-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crediflow-beta194-build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable base
        run: |
          cat crediflow-build/base.part00 crediflow-build/base.part01 crediflow-build/base.part02 crediflow-build/base.part03 crediflow-build/base.part04 crediflow-build/base.part05 crediflow-build/base.part06 crediflow-build/base.part07 | base64 -d > /tmp/base.apk
          echo '3d13bfb2e55c9d9719f19f6769701a28e438566574022bb4cd4d7220197a46c0  /tmp/base.apk' | sha256sum -c -
      - name: Decode
        run: |
          curl -fL --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
          java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/app
      - name: Apply updater module
        run: python crediflow-build/patch_beta194.py
      - name: Build and verify
        run: |
          java -jar /tmp/apktool.jar b /tmp/app -o /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk
          unzip -t /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk
          grep -q 'versionCode: 194' /tmp/app/apktool.yml
          grep -q 'versionName: 1.9.4' /tmp/app/apktool.yml
          grep -q 'UpdateActivity' /tmp/app/AndroidManifest.xml
          grep -q 'UpdateOpenListener' $(find /tmp/app -name MainActivityV06.smali)
          mkdir -p /tmp/qa
          sha256sum /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk > /tmp/qa/hashes.txt
          printf '%s\n' 'OK clean_apktool_rebuild' 'OK version_194' 'OK update_activity_declared' 'OK native_profile_button' 'OK source_level_smali_assembly' > /tmp/qa/QA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrediFlow-v1.9.4-beta-build194-unsigned
          path: |
            /tmp/CrediFlow-v1.9.4-beta-build194-unsigned.apk
            /tmp/qa/QA.txt
            /tmp/qa/hashes.txt
          if-no-files-found: error
          retention-days: 7
