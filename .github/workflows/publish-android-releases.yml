name: Publicar Android no GitHub Releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-releases.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar APK oficial e beta já validados
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.4.0.apk' \
            -o TAREFAS-2.4.0.apk

          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/GuerraVPN/Tarefas/app/releases/downloads/TAREFAS-2.4.1.apk' \
            -o TAREFAS-2.4.1-beta.apk

          test -s TAREFAS-2.4.0.apk
          test -s TAREFAS-2.4.1-beta.apk

          sha256sum TAREFAS-2.4.0.apk > TAREFAS-2.4.0.apk.sha256
          sha256sum TAREFAS-2.4.1-beta.apk > TAREFAS-2.4.1-beta.apk.sha256

          unzip -tq TAREFAS-2.4.0.apk
          unzip -tq TAREFAS-2.4.1-beta.apk

      - name: Preparar notas das releases
        shell: bash
        run: |
          cat > stable-notes.md <<'EOF'
          ## TAREFAS Android 2.4.0 — Release Oficial

          Versão estável atual para uso normal.

          **Build:** 274  
          **Canal:** Oficial  
          **Base Web:** 7.9.1

          ### Destaques
          - Consolida a linha de desenvolvimento 2.3.x.
          - Base Web 7.9.1 integrada.
          - Central 2.0, favoritos, filtros avançados e melhorias de diagnóstico.
          - Patch Manager .tpatch v1 integrado.
          - Biometria ajustada para novo início real do app.
          - Correções de estabilidade, navegação, notificações e sincronização.

          ### Arquivos
          Baixe **TAREFAS-2.4.0.apk** nos Assets abaixo.  
          O arquivo **.sha256** pode ser usado para conferir a integridade do APK.
          EOF

          cat > beta-notes.md <<'EOF'
          ## TAREFAS Android 2.4.1 — Beta

          Base Beta nativa atual.

          **Build:** 276  
          **Canal:** Beta  
          **Base Web:** 7.9.1

          ### Destaques
          - Adiciona a ponte nativa Android para o seletor de ícones.
          - Corrige o ícone padrão do APK.
          - Permite usar TAREFAS Azul, Militar, Preto & Ouro, Sistema e o ícone/foto do perfil no atalho da tela inicial.
          - Mantém o Patch Manager .tpatch v1.
          - A partir desta base, próximas Betas e Alphas podem ser distribuídas como patches pelo próprio aplicativo.
          - Mantém todas as funções e correções da Oficial 2.4.0.

          ### Arquivos
          Baixe **TAREFAS-2.4.1-beta.apk** nos Assets abaixo.  
          O arquivo **.sha256** pode ser usado para conferir a integridade do APK.

          > Esta versão é Beta e pode receber patches Alpha/Beta antes da próxima promoção oficial.
          EOF

      - name: Publicar Release oficial
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-v2.4.0'

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              TAREFAS-2.4.0.apk \
              TAREFAS-2.4.0.apk.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title 'TAREFAS Android 2.4.0 — Oficial' \
              --notes-file stable-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              TAREFAS-2.4.0.apk \
              TAREFAS-2.4.0.apk.sha256 \
              --target 'app/android-v240-prep' \
              --title 'TAREFAS Android 2.4.0 — Oficial' \
              --notes-file stable-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publicar Pré-release Beta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-v2.4.1-beta'

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              TAREFAS-2.4.1-beta.apk \
              TAREFAS-2.4.1-beta.apk.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title 'TAREFAS Android 2.4.1 — Beta' \
              --notes-file beta-notes.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              TAREFAS-2.4.1-beta.apk \
              TAREFAS-2.4.1-beta.apk.sha256 \
              --target 'beta-2.4.1' \
              --title 'TAREFAS Android 2.4.1 — Beta' \
              --notes-file beta-notes.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
