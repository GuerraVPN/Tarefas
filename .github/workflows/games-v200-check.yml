name: Games 2.0.0 Finish Check
on:
  push:
    branches: [games/v200-prep]
    paths:
      - 'app/games.html'
      - 'app/games.css'
      - 'app/games.js'
      - '.github/workflows/games-v200-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: games/v200-prep
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e recursos
        run: |
          node --check app/games.js
          grep -q "APP 2.0.0" app/games.js
          grep -q "WEB 7.6.0" app/games.js
          grep -q "AudioDirector" app/games.js
          grep -q "pointerdown" app/games.js
          grep -q "setPointerCapture" app/games.js
          grep -q "contextmenu" app/games.js
          grep -q "user-select:none" app/games.css
          grep -q "touch-action:manipulation" app/games.css
          grep -q "data-layout=\"canvas\"" app/games.html
          grep -q "musicToggle" app/games.html
          for game in dino snake memory game2048 minesweeper precision reflex flight hillclimb; do grep -q "$game" app/games.js; done
      - name: Bundle atual
        run: |
          npm ci
          npm run build:web
          node --check dist/games.js
          grep -q "26º PEL PE MEC" dist/games.js
          grep -q "games.css?v=2.0.0" dist/games.html
