name: Android 2.3.22.5 Alpha - Remover acesso rapido

on:
  workflow_dispatch:
  push:
    branches: [app/android-v23225-prep]
    paths:
      - 'app/mobile-alpha-v23223-fix.js'
      - 'app/release-v23223.txt'
      - 'scripts/build-mobile-v23223.mjs'
      - 'scripts/verify-mobile-v23223.mjs'
      - 'scripts/release-mobile-v23223.sh'
      - '.github/workflows/android-v23225-alpha.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build, assinar, publicar e registrar Alpha
        run: bash scripts/release-mobile-v23223.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-android-2.3.22.5-alpha-build-268
          path: |
            TAREFAS-2.3.22.5.apk
            TAREFAS-2.3.22.5.apk.sha256
            TAREFAS-2.3.22.5-alpha-build-268.zip
            TAREFAS-2.3.22.5-alpha-build-268.zip.sha256
            app/release-v23223.txt
            dist/ALPHA_2_3_22_5.json
          if-no-files-found: error
