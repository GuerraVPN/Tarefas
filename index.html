<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAREFAS - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #1e3a8a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 350px;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px #0006;
    }

    .logo {
      text-align: center;
      color: #2563eb;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 0 0 25px;
    }

    h2 {
      text-align: center;
      margin: 0 0 20px;
      color: #111827;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    .status {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    .status.erro { color: #dc2626; }
    .status.ok { color: #047857; }

    .rodape {
      text-align: center;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login">
    <div class="logo">TAREFAS</div>
    <p class="subtitle">26º Pel PE Mec</p>
    <h2>Entrar</h2>

    <form id="formLogin" autocomplete="on">
      <label for="loginCpf">CPF</label>
      <input
        type="text"
        id="loginCpf"
        placeholder="000.000.000-00"
        inputmode="numeric"
        autocomplete="username"
        maxlength="14"
        required
      />

      <label for="loginSenha">Senha</label>
      <input
        type="password"
        id="loginSenha"
        placeholder="Senha"
        autocomplete="current-password"
        required
      />

      <button type="submit" id="btnEntrar">Entrar</button>
      <div id="statusLogin" class="status" aria-live="polite"></div>
    </form>

    <div class="rodape">
      O cadastro de usuários é realizado somente pela administração do sistema.
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bpvijatnsluwsgnzklrd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmlqYXRuc2x1d3NnbnprbHJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzkxNDMsImV4cCI6MjEwMjQxNTE0M30.uvyfm9mgl6MON0v75CwfGzNz6FBqw58uzR4ZcRAOLNQ";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function cpfSomenteNumeros(valor) {
      return String(valor || "").replace(/\D/g, "").slice(0, 11);
    }

    function emailTecnicoDoCpf(cpf) {
      return `${cpf}@auth.26pel.local`;
    }

    function setStatus(texto, tipo = "") {
      const el = document.getElementById("statusLogin");
      el.textContent = texto || "";
      el.className = `status ${tipo}`.trim();
    }

    document.getElementById("loginCpf").addEventListener("input", function () {
      let cpf = cpfSomenteNumeros(this.value);
      cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
      cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
      cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      this.value = cpf;
    });

    async function carregarPerfilDaSessao(authUser) {
      const { data, error } = await supabaseClient
        .from("usuarios")
        .select("id,nome_completo,nome_guerra,cpf,patente,secao,posicao,telefone,email,avatar,auth_user_id")
        .eq("auth_user_id", authUser.id)
        .single();

      if (error || !data) {
        throw new Error("Sua conta foi autenticada, mas o perfil não está vinculado na tabela usuarios.");
      }

      // Compatibilidade temporária com as páginas atuais.
      // A segurança real passa a vir da sessão Auth/RLS, não deste objeto.
      localStorage.setItem("usuarioLogado", JSON.stringify({
        id: data.id,
        auth_user_id: data.auth_user_id,
        nome_completo: data.nome_completo,
        nome_guerra: data.nome_guerra,
        cpf: data.cpf,
        patente: data.patente,
        secao: data.secao,
        posicao: data.posicao,
        telefone: data.telefone || "",
        email: data.email || "",
        avatar: data.avatar || ""
      }));

      return data;
    }

    document.getElementById("formLogin").addEventListener("submit", async function (event) {
      event.preventDefault();

      const cpf = cpfSomenteNumeros(document.getElementById("loginCpf").value);
      const senha = document.getElementById("loginSenha").value;
      const btn = document.getElementById("btnEntrar");

      if (cpf.length !== 11) {
        setStatus("Informe um CPF com 11 dígitos.", "erro");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Autenticando...";
      setStatus("Validando credenciais...");

      try {
        // O usuário continua digitando CPF, mas o Supabase Auth usa um e-mail técnico determinístico.
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
          email: emailTecnicoDoCpf(cpf),
          password: senha
        });

        if (authError || !authData?.user) {
          throw new Error("CPF ou senha incorretos.");
        }

        const perfil = await carregarPerfilDaSessao(authData.user);
        setStatus(`Bem-vindo, ${[perfil.patente, perfil.nome_guerra].filter(Boolean).join(" ")}!`, "ok");

        setTimeout(() => {
          window.location.href = "menu.html";
        }, 250);
      } catch (err) {
        await supabaseClient.auth.signOut().catch(() => {});
        localStorage.removeItem("usuarioLogado");
        setStatus(err.message || "Não foi possível entrar.", "erro");
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });

    // Se já houver sessão Auth válida, tenta restaurar o perfil e seguir para o menu.
    (async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session?.user) return;

        await carregarPerfilDaSessao(session.user);
        window.location.href = "menu.html";
      } catch (_) {
        await supabaseClient.auth.signOut().catch(() => {});
        localStorage.removeItem("usuarioLogado");
      }
    })();
  </script>
</body>
</html>
