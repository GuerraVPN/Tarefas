<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAREFAS — Reiniciando</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e5e7eb;font-family:Arial,sans-serif;padding:20px}.box{width:min(560px,100%);padding:32px;border:1px solid #334155;border-radius:22px;background:#0f172a;text-align:center;box-shadow:0 28px 70px #0009}.spin{width:46px;height:46px;border:5px solid #334155;border-top-color:#60a5fa;border-radius:50%;margin:20px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0 0 8px;color:#fff}p{color:#94a3b8;line-height:1.55}.status{margin-top:14px;padding:10px;border-radius:10px;background:#111827;font-size:12px;color:#cbd5e1}.btn{margin-top:16px;border:1px solid #475569;background:#111827;color:#e5e7eb;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
</style>
</head>
<body><main class="box"><h1>🔄 Reiniciando o TAREFAS</h1><p>O administrador solicitou um reinício do sistema. O cache local está sendo atualizado.</p><div class="spin"></div><div class="status" id="status">Preparando reinício…</div><button class="btn" id="retry" hidden>Tentar voltar</button></main>
<script>
const SUPABASE_URL='https://bpvijatnsluwsgnzklrd.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmlqYXRuc2x1d3NnbnprbHJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzkxNDMsImV4cCI6MjEwMjQxNTE0M30.uvyfm9mgl6MON0v75CwfGzNz6FBqw58uzR4ZcRAOLNQ';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const user=()=>{try{return JSON.parse(localStorage.getItem('usuarioLogado')||'null')}catch(_){return null}};
const row=d=>Array.isArray(d)?(d[0]||null):(d||null);
async function admin(){
 const u=user();if(!u?.id)return false;
 try{const r=await supabaseClient.rpc('v7_4_12_admin_context',{p_usuario_id:Number(u.id)}),d=row(r.data);if(!r.error&&d?.is_admin)return true}catch(_){}
 try{const q=await supabaseClient.from('usuario_perfis').select('secao,ativo').eq('usuario_id',Number(u.id)).eq('ativo',true);return !q.error&&(q.data||[]).some(x=>String(x.secao||'').trim().toLowerCase()==='admin')}catch(_){return false}
}
async function state(){
 for(const name of ['v7_4_12_estado_site','v7_4_9_estado_site','v7_4_7_estado_site']){
  try{const r=await supabaseClient.rpc(name);if(!r.error)return row(r.data)}catch(_){}
 }
 return null;
}
async function clearRuntime(){
 $('status').textContent='Limpando cache e arquivos temporários…';
 try{if('caches'in window){const names=await caches.keys();await Promise.all(names.map(n=>caches.delete(n)))}if(navigator.serviceWorker?.getRegistrations){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}}catch(_){}
}
async function boot(){
 if(!user()?.id){location.replace('index.html');return}
 if(await admin()){location.replace('dashboard.html?site_admin=1');return}
 await clearRuntime();
 $('status').textContent='Verificando o sistema…';
 let latest=await state();
 if(latest?.modo==='desligado'){location.replace('desligado.html?from=restart');return}
 if(latest?.restart_token!=null)localStorage.setItem('tarefas_site_791_restart_seen',String(latest.restart_token));
 localStorage.setItem('tarefas_site_791_restart_completed_at',String(Date.now()));
 setTimeout(()=>{const u=new URL('dashboard.html',location.href);u.searchParams.set('_restart',String(Date.now()));location.replace(u.href)},3500);
 setTimeout(()=>{$('retry').hidden=false;$('status').textContent='Se o retorno não acontecer automaticamente, toque em “Tentar voltar”.'},8000);
}
$('retry').onclick=()=>location.replace('dashboard.html?_restart='+Date.now());
boot();
</script></body></html>
