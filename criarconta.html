<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAREFAS - Cadastro local</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#1e3a8a;display:flex;justify-content:center;align-items:center;padding:24px}
.card{width:100%;max-width:520px;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px #0006}
.logo{text-align:center;color:#2563eb;font-size:28px;font-weight:700;margin-bottom:4px}
.sub{text-align:center;color:#64748b;margin:0 0 24px}
h2{text-align:center;color:#1f2937;margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.full{grid-column:1/-1}
label{display:block;margin:0 0 6px;font-size:14px;font-weight:700;color:#374151}
input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin-bottom:16px;background:#fff}
input:focus,select:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px #2563eb1a}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#1d4ed8} button:disabled{background:#93c5fd;cursor:not-allowed}
.note{margin:18px 0 0;padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;color:#9a3412;font-size:12px;line-height:1.45}
.back{text-align:center;margin-top:18px} .back a{color:#2563eb;font-weight:700;text-decoration:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="card">
<div class="logo">TAREFAS</div>
<p class="sub">26º Pel PE Mec</p>
<h2>Cadastro de usuário</h2>
<form id="formCadastro">
<div class="grid">
<div class="full"><label for="nome">Nome completo</label><input id="nome" required></div>
<div><label for="guerra">Nome de guerra</label><input id="guerra" required></div>
<div><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></div>
<div><label for="patente">Posto/Graduação</label><select id="patente" required>
<option value="">Selecione...</option>Sd Ev<option>Sd</option><option>Cb</option><option>3º Sgt</option><option>2º Sgt</option><option>1º Sgt</option><option>ST</option><option>Asp</option><option>2º Ten</option><option>1º Ten</option><option>Cap</option><option>Maj</option><option>Ten Cel</option><option>Cel</option><option>Admin</option>
</select></div>
<div><label for="secao">Seção</label><select id="secao" required>
<option value="">Selecione...</option><option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>Fiscalização</option><option>Pagamento</option><option>SALC</option><option>Garagem</option><option value="ResMat">Reserva de Materiais</option><option value="ResArmt">Reserva de Armamento</option><option>Informática</option><option value="comandante">Comandante</option><option value="admin">Admin</option>
</select></div>
<div><label for="posicao">Posição</label><select id="posicao" required><option value="">Selecione...</option><option>Auxiliar</option><option>Chefe</option><option>Comandante</option><option>Administrador</option></select></div>
<div><label for="telefone">Telefone</label><input id="telefone" type="tel" placeholder="(00) 00000-0000"></div>
<div><label for="email">E-mail</label><input id="email" type="email" placeholder="usuario@exemplo.com"></div>
<div><label for="senha">Senha</label><input id="senha" type="password" minlength="6" required></div>
<div><label for="confirmarSenha">Confirmar senha</label><input id="confirmarSenha" type="password" minlength="6" required></div>
<div class="full"><button type="submit" id="btnEnviar">Criar usuário</button></div>
</div>
</form>
<div class="note"><strong>Modo clássico temporário:</strong> esta página grava a senha na tabela <code>usuarios</code>. Mantenha este arquivo fora da hospedagem pública.</div>
<div class="back"><a href="index.html">Voltar ao login</a></div>
</div>
<script>
const SUPABASE_URL='https://bpvijatnsluwsgnzklrd.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmlqYXRuc2x1d3NnbnprbHJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzkxNDMsImV4cCI6MjEwMjQxNTE0M30.uvyfm9mgl6MON0v75CwfGzNz6FBqw58uzR4ZcRAOLNQ';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const cpfEl=document.getElementById('cpf');
cpfEl.addEventListener('input',function(){let v=this.value.replace(/\D/g,'').slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');this.value=v;});
document.getElementById('secao').addEventListener('change',function(){if(this.value==='admin'){document.getElementById('patente').value='Admin';document.getElementById('posicao').value='Administrador';}else if(this.value==='comandante'){document.getElementById('posicao').value='Comandante';}});
document.getElementById('formCadastro').addEventListener('submit',async e=>{
 e.preventDefault(); const btn=document.getElementById('btnEnviar');
 const cpf=document.getElementById('cpf').value.replace(/\D/g,'');
 const senha=document.getElementById('senha').value, conf=document.getElementById('confirmarSenha').value;
 if(cpf.length!==11) return alert('Informe um CPF com 11 dígitos.');
 if(senha!==conf) return alert('As senhas não são iguais.');
 if(senha.length<6) return alert('A senha deve ter pelo menos 6 caracteres.');
 btn.disabled=true; btn.textContent='Criando...';
 try{
   const payload={nome_completo:document.getElementById('nome').value.trim(),nome_guerra:document.getElementById('guerra').value.trim(),cpf,patente:document.getElementById('patente').value,secao:document.getElementById('secao').value,posicao:document.getElementById('posicao').value,telefone:document.getElementById('telefone').value.trim()||null,email:document.getElementById('email').value.trim()||null,senha};
   const {error}=await supabaseClient.from('usuarios').insert([payload]); if(error) throw error;
   alert('Usuário criado com sucesso.'); e.target.reset();
 }catch(err){alert('Erro ao criar usuário: '+err.message);}finally{btn.disabled=false;btn.textContent='Criar usuário';}
});
</script>
</body></html>
