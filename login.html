<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAREFAS - Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #1e3a8a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 320px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px #0006;
        }

        .logo {
            text-align: center;
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .criar-conta {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .criar-conta a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .criar-conta a:hover {
            text-decoration: underline;
        }
    
        .recuperar {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .recuperar a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .recuperar a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login">

        <div class="logo">
            TAREFAS
        </div>

        <p class="subtitle">
            Organize suas tarefas
        </p>

        <h2>Entrar</h2>

        <form>

            <input
                type="cpf"
                placeholder="CPF"
                required
            >

            <input
                type="password"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div class="criar-conta">
            Não possui uma conta?
            <a href="#">
                Criar conta
            </a>
        </div>
        <div class="recuperar">
            Quer recuperar a senha?
            <a href="#">
                Recuperar a senha
            </a>
        </div>

    </div>

</body>
</html>
