<!doctype html>
<html>  
 <head>
<meta charset="utf-8"/>
<title>Supabase Test</title>  
 </head> 
<body>    
<h2>Supabase Test</h2>
<label>Project URL</label>
<br/>    
 <input id="projectUrl" style="width: 520px;" value="https://bpvijatnsluwsgnzklrd.supabase.co"/>
 <br/><br/>   
<label>Anon key</label>
 <br/>   
<input id="anonKey" style="width: 520px; height: 90px;" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmlqYXRuc2x1d3NnbnprbHJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzkxNDMsImV4cCI6MjEwMjQxNTE0M30.uvyfm9mgl6MON0v75CwfGzNz6FBqw58uzR4ZcRAOLNQ" />
</input>
<br/>
<br/>    
<label>Tabela</label>
<br/>    
 <input id="table" style="width: 520px;" value="usuarios"/>
<br/>
<br/>    
<button id="btn">Buscar</button>    
<h3>Resultado</h3>    
<pre id="out">
</pre>    
<script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
      const projectUrlEl = document.getElementById("projectUrl");
      const anonKeyEl = document.getElementById("anonKey");
      const tableEl = document.getElementById("table");
      const outEl = document.getElementById("out");
      const btnEl = document.getElementById("btn");
      btnEl.addEventListener("click", async () => {
        outEl.textContent = "Carregando...";
        const projectUrl = projectUrlEl.value.trim();
        const anonKey = anonKeyEl.value.trim();
        if (!anonKey) {
          outEl.textContent = "Cole a ANON KEY no campo (textarea) antes de buscar.";
          return;
        }
        const supabase = createClient(projectUrl, anonKey);
        const { data, error } = await supabase
          .from(tableEl.value.trim())
          .select("*")
          .limit(50);
        if (error) {
          outEl.textContent = error.message;
          return;
        }
        outEl.textContent = JSON.stringify(data, null, 2);
      });   
</script> 
</body>
</html>
