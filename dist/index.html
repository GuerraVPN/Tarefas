  <title>TAREFAS - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #1e3a8a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .login {
      width: 320px;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px #0006;
    }
    .logo {
      text-align: center;
      color: #2563eb;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    h2 { text-align: center; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .criar-conta {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
    .criar-conta a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .criar-conta a:hover { text-decoration: underline; }
  </style>
    <link rel="stylesheet" href="v4_tema.css?v=6.0">
  <link rel="stylesheet" href="mobile.css">

  <link rel="stylesheet" href="mobile-v181.css">

</head>

<body>
  <div class="login">
    <div class="logo">TAREFAS</div>
    <p class="subtitle">Organize suas tarefas</p>
    <h2>Entrar</h2>

    <form id="formLogin">
      <input
        type="text"
        id="loginCpf"
        placeholder="CPF"
        maxlength="14"
        required
      />
      <input
        type="password"
        id="loginSenha"
        placeholder="Senha"
        required
      />
      <button type="submit" id="btnEntrar">Entrar</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://bpvijatnsluwsgnzklrd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmlqYXRuc2x1d3NnbnprbHJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzkxNDMsImV4cCI6MjEwMjQxNTE0M30.uvyfm9mgl6MON0v75CwfGzNz6FBqw58uzR4ZcRAOLNQ";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // V3 — Sessão de 30 minutos de INATIVIDADE
    // ============================================================
    const SESSAO26_CHAVE = "sessao26_ultima_atividade";
    const SESSAO26_TEMPO = 30 * 60 * 1000;
    const MENSAGENS_SESSAO_CHAVE = "tarefasPushSession17";

    function lerUsuarioJaLogado() {
      try {
        return JSON.parse(localStorage.getItem("usuarioLogado") || "null");
      } catch (_) {
        return null;
      }
    }

    function encerrarSessaoLocal() {
      localStorage.removeItem("usuarioLogado");
      localStorage.removeItem(SESSAO26_CHAVE);
      localStorage.removeItem(MENSAGENS_SESSAO_CHAVE);
    }

    function sessaoAindaValida() {
      const usuario = lerUsuarioJaLogado();
      if (!usuario || !usuario.id) return false;

      const agora = Date.now();
      let ultimaAtividade = Number(localStorage.getItem(SESSAO26_CHAVE) || 0);

      // Compatibilidade: usuário que já estava logado antes deste patch.
      // Na primeira abertura, inicia os 30 minutos sem obrigar novo login.
      if (!ultimaAtividade) {
        ultimaAtividade = agora;
        localStorage.setItem(SESSAO26_CHAVE, String(agora));
        return true;
      }

      if ((agora - ultimaAtividade) >= SESSAO26_TEMPO) {
        encerrarSessaoLocal();
        return false;
      }

      return true;
    }

    // Se já está autenticado e a sessão não expirou, nem exibe o login.
    if (sessaoAindaValida()) {
      window.location.replace("dashboard.html");
    }


    // CPF máscara
    document.getElementById("loginCpf").addEventListener("input", function () {
      let cpf = this.value.replace(/\D/g, "");
      if (cpf.length > 11) cpf = cpf.substring(0, 11);

      cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
      cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
      cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      this.value = cpf;
    });

    document.getElementById("formLogin").addEventListener("submit", async function (event) {
      event.preventDefault();

      const cpfLimpo = document.getElementById("loginCpf").value.replace(/\D/g, "");
      const senhaDigitada = document.getElementById("loginSenha").value;
      const btnEntrar = document.getElementById("btnEntrar");

      btnEntrar.disabled = true;
      btnEntrar.innerText = "Autenticando...";

      try {
        // Busca usuário pelo CPF
        const { data, error } = await supabaseClient
          .from("usuarios")
          .select("*")
          .eq("cpf", cpfLimpo)
          .single();

        if (error || !data) {
          alert("CPF não cadastrado ou erro na busca.");
          return;
        }

        // Verifica senha (igual ao seu código atual)
        if (data.senha === senhaDigitada) {
          // A V7.5.8 também emite uma sessão curta/privada no backend para
          // bloquear/desbloquear e enviar mensagens sem confiar apenas no ID do navegador.
          const sessaoMensagens = await supabaseClient.rpc("v1_7_emitir_sessao_push", {
            p_usuario_id: Number(data.id),
            p_senha: senhaDigitada
          });
          if (sessaoMensagens.error || !sessaoMensagens.data) {
            throw new Error("Não foi possível iniciar a sessão protegida de mensagens.");
          }

          localStorage.setItem(MENSAGENS_SESSAO_CHAVE, String(sessaoMensagens.data));
          localStorage.setItem(
            "usuarioLogado",
            JSON.stringify({
              id: data.id,
              nome_completo: data.nome_completo,
              nome_guerra: data.nome_guerra,
              patente: data.patente,
              secao: data.secao,
              posicao: data.posicao,
              cpf: data.cpf
            })
          );

          localStorage.setItem(SESSAO26_CHAVE, String(Date.now()));

          alert(`Bem-vindo, ${data.patente} ${data.nome_guerra}!`);
          window.location.href = "dashboard.html";
        } else {
          localStorage.removeItem(MENSAGENS_SESSAO_CHAVE);
          alert("Senha incorreta.");
        }
      } catch (err) {
        localStorage.removeItem(MENSAGENS_SESSAO_CHAVE);
        alert("Erro ao conectar ao servidor: " + err.message);
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.innerText = "Entrar";
      }
    });

    // O index é a tela de login.
    // O menu só é aberto após um login bem-sucedido.
  </script>

</body>
